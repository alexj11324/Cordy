# Patchbay self-hosted messaging manifest (operator-owned)
#
# The app never reads or edits this file. Render it into the server
# deployment, keep credentials in the deployment secret store, and run
# scripts/messaging-self-host-check.sh before starting the gateway.
version: 1
mode: server_configured
bootstrap:
  # Set PATCHBAY_MESSAGING_BOOTSTRAP=true to materialize the provider rows at
  # server start. These ids are deployment-owned, never browser form fields.
  workspace_id_env: PATCHBAY_MESSAGING_WORKSPACE_ID
  installer_user_id_env: PATCHBAY_MESSAGING_INSTALLER_USER_ID
  agent_id_env: PATCHBAY_MESSAGING_AGENT_ID
public:
  # Must be the HTTPS app host reachable from phones and external IM users.
  app_url: https://app.example.com
  # API/daemon host. Do not use this as a QR or account-binding URL.
  api_url: https://api.example.com
providers:
  slack:
    transport: socket_mode
    app_token_env: SLACK_APP_TOKEN
    bot_token_env: SLACK_BOT_TOKEN
    app_id_env: SLACK_APP_ID
    team_id_env: SLACK_TEAM_ID
    bot_user_id_env: SLACK_BOT_USER_ID
  telegram:
    transport: polling
    bot_token_env: TELEGRAM_BOT_TOKEN
    bot_username_env: TELEGRAM_BOT_USERNAME
  lark:
    transport: websocket
    app_id_env: LARK_APP_ID
    app_secret_env: LARK_APP_SECRET
    tenant_key_env: LARK_TENANT_KEY
    bot_open_id_env: LARK_BOT_OPEN_ID
    region_env: LARK_REGION
  dingtalk:
    transport: stream
    client_id_env: DINGTALK_CLIENT_ID
    client_secret_env: DINGTALK_CLIENT_SECRET
  wecom:
    transport: websocket
    bot_id_env: WECOM_BOT_ID
    secret_env: WECOM_SECRET
    bot_name_env: WECOM_BOT_NAME
  weixin:
    transport: polling
    secret_key_env: PATCHBAY_WEIXIN_SECRET_KEY
