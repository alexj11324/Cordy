# Official Patchbay Cloud Slack app. This is intentionally separate from the
# self-hosted Socket Mode manifest: one hosted app uses OAuth + signed Events
# API callbacks and routes each event by app_id + team_id.
display_information:
  name: Patchbay
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Patchbay
    always_online: true
oauth_config:
  redirect_urls:
    - https://api.aspectlylabs.com/api/integrations/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - files:read
      - groups:history
      - im:history
      - mpim:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://api.aspectlylabs.com/api/integrations/slack/events
    bot_events:
      - app_uninstalled
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
