name: cordy # legacy-brand-compat: preserves the existing production Compose project

services:
  docs:
    image: ${PATCHBAY_DOCS_IMAGE_REF:?PATCHBAY_DOCS_IMAGE_REF must be an immutable digest}
    ports:
      - "127.0.0.1:4000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
