services:
  backend:
    image: ${ORVILO_BACKEND_IMAGE_REF:?ORVILO_BACKEND_IMAGE_REF must be an immutable digest}
    environment:
      # Hosted production has fixed origins, including after a legacy snapshot restore.
      ORVILO_PUBLIC_URL: https://api.aspectlylabs.com
      ORVILO_APP_URL: https://orvilo.aspectlylabs.com
      FRONTEND_ORIGIN: https://orvilo.aspectlylabs.com
      CORS_ALLOWED_ORIGINS: https://orvilo.aspectlylabs.com,https://accounts.aspectlylabs.com
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set COOKIE_DOMAIN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?Set CLERK_JWT_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER:?Set CLERK_ISSUER}
      # Both browser origins mint Clerk session tokens. Keep this allow-list
      # at the frozen production origins so Web /auth/clerk exchange does not
      # silently reject tokens issued on orvilo.aspectlylabs.com.
      CLERK_AUTHORIZED_PARTIES: https://accounts.aspectlylabs.com,https://orvilo.aspectlylabs.com
      ORVILO_DESKTOP_BROKER_AUTH_TOKEN: ${ORVILO_DESKTOP_BROKER_AUTH_TOKEN:?Set ORVILO_DESKTOP_BROKER_AUTH_TOKEN}
      # Hosted IM / Cloud metering. Empty keeps inbound turns unlimited
      # rather than refusing every Slack/Lark message. Do not use :? —
      # Cloud may not be fully wired on every cut.
      ORVILO_CLOUD_URL: ${ORVILO_CLOUD_URL:-}
      ORVILO_SLACK_SECRET_KEY: ${ORVILO_SLACK_SECRET_KEY:-}
      ORVILO_SLACK_CLIENT_ID: ${ORVILO_SLACK_CLIENT_ID:-}
      ORVILO_SLACK_CLIENT_SECRET: ${ORVILO_SLACK_CLIENT_SECRET:-}
      ORVILO_SLACK_SIGNING_SECRET: ${ORVILO_SLACK_SIGNING_SECRET:-}

  frontend:
    image: ${ORVILO_WEB_IMAGE_REF:?ORVILO_WEB_IMAGE_REF must be an immutable digest}
    environment:
      REMOTE_API_URL: http://backend:8080
      # Clerk middleware reads the SDK-standard server variables at request
      # time. The explicit Orvilo variable is also passed to ClerkProvider so
      # the same runtime key reaches the client without a build-time secret.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${ORVILO_CLERK_PUBLISHABLE_KEY:?Set ORVILO_CLERK_PUBLISHABLE_KEY}
      ORVILO_CLERK_PUBLISHABLE_KEY: ${ORVILO_CLERK_PUBLISHABLE_KEY:?Set ORVILO_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      ORVILO_AUTH_BROKER_ORIGIN: https://accounts.aspectlylabs.com
      NEXT_PUBLIC_ACCOUNTS_URL: https://accounts.aspectlylabs.com
