services:
  backend:
    image: ${PATCHBAY_BACKEND_IMAGE_REF:?PATCHBAY_BACKEND_IMAGE_REF must be an immutable digest}
    environment:
      PATCHBAY_PUBLIC_URL: ${PATCHBAY_PUBLIC_URL:?Set PATCHBAY_PUBLIC_URL to https://api.aspectlylabs.com}
      PATCHBAY_APP_URL: ${PATCHBAY_APP_URL:?Set PATCHBAY_APP_URL to https://patchbay.aspectlylabs.com}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to https://patchbay.aspectlylabs.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set COOKIE_DOMAIN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?Set CLERK_JWT_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER:?Set CLERK_ISSUER}
      # Both browser origins mint Clerk session tokens. Keep this allow-list
      # at the frozen production origins so Web /auth/clerk exchange does not
      # silently reject tokens issued on patchbay.aspectlylabs.com.
      CLERK_AUTHORIZED_PARTIES: https://accounts.aspectlylabs.com,https://patchbay.aspectlylabs.com
      PATCHBAY_DESKTOP_BROKER_AUTH_TOKEN: ${PATCHBAY_DESKTOP_BROKER_AUTH_TOKEN:?Set PATCHBAY_DESKTOP_BROKER_AUTH_TOKEN}

  frontend:
    image: ${PATCHBAY_WEB_IMAGE_REF:?PATCHBAY_WEB_IMAGE_REF must be an immutable digest}
    environment:
      REMOTE_API_URL: http://backend:8080
      # Clerk middleware reads the SDK-standard server variables at request
      # time. The explicit Patchbay variable is also passed to ClerkProvider so
      # the same runtime key reaches the client without a build-time secret.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${PATCHBAY_CLERK_PUBLISHABLE_KEY:?Set PATCHBAY_CLERK_PUBLISHABLE_KEY}
      PATCHBAY_CLERK_PUBLISHABLE_KEY: ${PATCHBAY_CLERK_PUBLISHABLE_KEY:?Set PATCHBAY_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
