services:
  backend:
    image: ${ORVILO_BACKEND_IMAGE_REF:?ORVILO_BACKEND_IMAGE_REF must be an immutable digest}
    environment:
      ORVILO_PUBLIC_URL: ${ORVILO_PUBLIC_URL:?Set ORVILO_PUBLIC_URL to https://api.staging.aspectlylabs.com}
      ORVILO_APP_URL: ${ORVILO_APP_URL:?Set ORVILO_APP_URL to https://staging.aspectlylabs.com}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to https://staging.aspectlylabs.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set COOKIE_DOMAIN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?Set CLERK_JWT_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER:?Set CLERK_ISSUER}
      CLERK_AUTHORIZED_PARTIES: https://accounts.staging.aspectlylabs.com,https://staging.aspectlylabs.com
      # docker-compose.selfhost.yml defaults APP_ENV to production, and the
      # analytics client falls back to it, so staging must label its own
      # events or internal QA activity lands in the production PostHog funnels.
      ANALYTICS_ENVIRONMENT: staging
      # docker-compose.selfhost.yml defaults ALLOW_SIGNUP to true. Staging
      # hosts are internet-routable, so this overlay pins false; provision
      # QA users in the dedicated Clerk app instead of public registration.
      ALLOW_SIGNUP: "false"
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?Set the staging QA email allowlist}
      ALLOWED_EMAIL_DOMAINS: ""
      # Production cookies named orvilo_auth / orvilo_csrf are scoped to
      # .aspectlylabs.com, so browsers still send them to staging hosts.
      # Distinct names keep Go's first-match Cookie lookup on the staging JWT.
      AUTH_COOKIE_NAME: orvilo_staging_auth
      CSRF_COOKIE_NAME: orvilo_staging_csrf
      ORVILO_DESKTOP_BROKER_AUTH_TOKEN: ${ORVILO_DESKTOP_BROKER_AUTH_TOKEN:?Set ORVILO_DESKTOP_BROKER_AUTH_TOKEN}
      ORVILO_CLOUD_URL: ${ORVILO_CLOUD_URL:-}
      ORVILO_SLACK_SECRET_KEY: ${ORVILO_SLACK_SECRET_KEY:-}
      ORVILO_SLACK_CLIENT_ID: ${ORVILO_SLACK_CLIENT_ID:-}
      ORVILO_SLACK_CLIENT_SECRET: ${ORVILO_SLACK_CLIENT_SECRET:-}
      ORVILO_SLACK_SIGNING_SECRET: ${ORVILO_SLACK_SIGNING_SECRET:-}

  frontend:
    image: ${ORVILO_WEB_IMAGE_REF:?ORVILO_WEB_IMAGE_REF must be an immutable digest}
    environment:
      REMOTE_API_URL: http://backend:8080
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${ORVILO_CLERK_PUBLISHABLE_KEY:?Set ORVILO_CLERK_PUBLISHABLE_KEY}
      ORVILO_CLERK_PUBLISHABLE_KEY: ${ORVILO_CLERK_PUBLISHABLE_KEY:?Set ORVILO_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      ORVILO_AUTH_BROKER_ORIGIN: https://accounts.staging.aspectlylabs.com
      NEXT_PUBLIC_ACCOUNTS_URL: https://accounts.staging.aspectlylabs.com
