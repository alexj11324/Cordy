server {
    listen 80;
    server_name patchbay-staging.nebula-spaces.com patchbay-staging-api.nebula-spaces.com patchbay-staging-accounts.nebula-spaces.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/patchbay-staging-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name patchbay-staging.nebula-spaces.com;
    ssl_certificate /etc/letsencrypt/live/patchbay-nebula-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchbay-nebula-staging/privkey.pem;
    client_max_body_size 32m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    location = /docs { proxy_pass http://127.0.0.1:14001; }
    location ^~ /docs/ { proxy_pass http://127.0.0.1:14001; }
    location = /ws {
        proxy_pass http://127.0.0.1:18211;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:13111; }
}
server {
    listen 443 ssl;
    server_name patchbay-staging-api.nebula-spaces.com;
    ssl_certificate /etc/letsencrypt/live/patchbay-nebula-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchbay-nebula-staging/privkey.pem;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:18211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
server {
    listen 443 ssl;
    server_name patchbay-staging-accounts.nebula-spaces.com;
    ssl_certificate /etc/letsencrypt/live/patchbay-nebula-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchbay-nebula-staging/privkey.pem;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:14301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Patchbay-Desktop-Broker-Auth "";
        include /run/patchbay-nebula-staging/*.conf;
    }
}
