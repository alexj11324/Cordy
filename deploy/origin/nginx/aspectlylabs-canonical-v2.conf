map $http_upgrade $patchbay_connection_upgrade {
    default upgrade;
    '' close;
}

upstream patchbay_frontend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream patchbay_backend {
    server 127.0.0.1:8180;
    keepalive 32;
}

upstream patchbay_docs {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name patchbay.aspectlylabs.com api.aspectlylabs.com docs.aspectlylabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name patchbay.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $patchbay_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://patchbay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $patchbay_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.aspectlylabs.com;

    client_max_body_size 16M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://patchbay_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $patchbay_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name accounts.aspectlylabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts.aspectlylabs.com;

    client_max_body_size 16M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Provider-specific broker entry and callback are the only auth protocol
    # routes. /login is the canonical Clerk continuation after the provider
    # callback; no legacy sign-in/card or generic provider route is exposed.
    location = /oauth/google {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $patchbay_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /oauth/google/callback {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $patchbay_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /login {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # The broker pages are Next client pages and need their own static chunks.
    location ^~ /_next/ {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /favicon.ico {
        proxy_pass http://patchbay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        return 404;
    }
}
