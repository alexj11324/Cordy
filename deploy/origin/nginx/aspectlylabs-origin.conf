server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts-origin.staging.aspectlylabs.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    # Distinct from orvilo-accounts-origin-auth.conf. The staging Worker
    # injects its own ORIGIN_AUTH_TOKEN; the production snippet would reject
    # it before traffic reaches 127.0.0.1:43101.
    include /etc/nginx/snippets/orvilo-staging-accounts-origin-auth.conf;

    client_max_body_size 16k;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:43101;
        proxy_http_version 1.1;
        proxy_set_header Host accounts.staging.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host accounts.staging.aspectlylabs.com;
        # The staging credential snippet above already authenticates this
        # value. Forward it for the broker's independent constant-time check.
        proxy_set_header X-Orvilo-Origin-Auth $http_x_orvilo_origin_auth;
        proxy_set_header X-Orvilo-Desktop-Broker-Auth "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

