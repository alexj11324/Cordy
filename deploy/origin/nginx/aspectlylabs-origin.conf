# Patchbay #632 origin. The accounts broker is an independent deployment and
# cannot be selected through a client-controlled forwarded-host header.

# Keep the existing accounts-to-Web route available until the Cloudflare
# Worker is cut over. This map is removed after the cutover is accepted.
map $http_x_forwarded_host $patchbay_public_host {
    "accounts.aspectlylabs.com" accounts.aspectlylabs.com;
    default $host;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        origin.aspectlylabs.com
        accounts-origin.aspectlylabs.com
        patchbay.aspectlylabs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-origin.aspectlylabs.com api.aspectlylabs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name origin.aspectlylabs.com patchbay.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $patchbay_public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $patchbay_public_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts-origin.aspectlylabs.com;

    # The first include admits only Cloudflare's published proxy ranges. The
    # second is a root-owned, deployment-provisioned comparison against the
    # Worker's ORIGIN_AUTH_TOKEN; its credential is intentionally not stored
    # in this repository.
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/patchbay-accounts-origin-auth.conf;

    client_max_body_size 16k;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:43100;
        proxy_http_version 1.1;
        proxy_set_header Host accounts.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host accounts.aspectlylabs.com;
        proxy_set_header X-Patchbay-Origin-Auth "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-origin.aspectlylabs.com api.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
