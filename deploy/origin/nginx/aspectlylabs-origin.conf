# Aspectly Labs origin.
#
# Public product traffic uses exactly:
#   api.aspectlylabs.com       -> Go server
#   orvilo.aspectlylabs.com  -> Web and Docs
#   accounts.aspectlylabs.com  -> Cloudflare edge -> Accounts broker
#
# Internal staging traffic uses exactly:
#   api.staging.aspectlylabs.com       -> staging Go server
#   staging.aspectlylabs.com           -> staging Web and Docs
#   accounts.staging.aspectlylabs.com  -> Cloudflare edge -> staging Accounts
#
# accounts-origin.aspectlylabs.com and
# accounts-origin.staging.aspectlylabs.com are the private Cloudflare-to-origin
# transport hostnames. They are not product endpoints and accept only Cloudflare
# source ranges plus a per-environment origin credential. Staging must include
# orvilo-staging-accounts-origin-auth.conf and must not reuse
# orvilo-accounts-origin-auth.conf; those files hold different Worker tokens.

server {
    listen 80;
    listen [::]:80;
    server_name
        api.aspectlylabs.com
        orvilo.aspectlylabs.com
        accounts-origin.aspectlylabs.com
        api.staging.aspectlylabs.com
        staging.aspectlylabs.com
        accounts-origin.staging.aspectlylabs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orvilo.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location = /docs {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host orvilo.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host orvilo.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host orvilo.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host orvilo.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host orvilo.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host orvilo.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts-origin.aspectlylabs.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/orvilo-accounts-origin-auth.conf;

    client_max_body_size 16k;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:43100;
        proxy_http_version 1.1;
        proxy_set_header Host accounts.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host accounts.aspectlylabs.com;
        # The Cloudflare-only server and credential snippet above already
        # authenticate this value. Forward it for the broker's independent
        # constant-time check; the broker removes it before route handling.
        proxy_set_header X-Orvilo-Origin-Auth $http_x_orvilo_origin_auth;
        proxy_set_header X-Orvilo-Desktop-Broker-Auth "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

