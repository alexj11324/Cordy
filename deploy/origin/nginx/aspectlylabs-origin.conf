# Aspectly Labs production origin.
#
# Public product traffic uses exactly:
#   api.aspectlylabs.com       -> Go server
#   patchbay.aspectlylabs.com  -> Web and Docs
#   accounts.aspectlylabs.com  -> Cloudflare edge -> Accounts broker
#
# accounts-origin.aspectlylabs.com is the existing private Cloudflare-to-origin
# transport hostname. It is not a product endpoint and accepts only Cloudflare
# source ranges plus the shared origin credential.

server {
    listen 80;
    listen [::]:80;
    server_name
        api.aspectlylabs.com
        patchbay.aspectlylabs.com
        accounts-origin.aspectlylabs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name patchbay.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location = /docs {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host patchbay.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host patchbay.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host patchbay.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host patchbay.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host patchbay.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host patchbay.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts-origin.aspectlylabs.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/patchbay-accounts-origin-auth.conf;

    client_max_body_size 16k;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:43100;
        proxy_http_version 1.1;
        proxy_set_header Host accounts.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host accounts.aspectlylabs.com;
        # The Cloudflare-only server and credential snippet above already
        # authenticate this value. Forward it for the broker's independent
        # constant-time check; the broker removes it before route handling.
        proxy_set_header X-Patchbay-Origin-Auth $http_x_patchbay_origin_auth;
        proxy_set_header X-Patchbay-Desktop-Broker-Auth "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aspectlylabs.com;

    client_max_body_size 256M;
    ssl_certificate /etc/nginx/ssl/aspectlylabs.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/aspectlylabs.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host api.aspectlylabs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host api.aspectlylabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
