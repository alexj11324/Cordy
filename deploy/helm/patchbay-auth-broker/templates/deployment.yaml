{{- if .Values.enabled }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}{{ fail "image.digest must be an immutable sha256 digest" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchbay-auth-broker.fullname" . }}
  labels:
    {{- include "patchbay-auth-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: patchbay-auth-broker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: patchbay-auth-broker } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: auth-broker
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PATCHBAY_API_ORIGIN, value: {{ .Values.config.apiOrigin | quote }} }
            - { name: PATCHBAY_AUTH_BROKER_ORIGIN, value: {{ .Values.config.brokerOrigin | quote }} }
            {{- range $name, $key := dict "CLERK_PUBLISHABLE_KEY" "clerk-publishable-key" "PATCHBAY_DESKTOP_BROKER_AUTH_TOKEN" "desktop-broker-auth-token" "PATCHBAY_ORIGIN_AUTH_TOKEN" "origin-auth-token" }}
            - name: {{ $name }}
              valueFrom: { secretKeyRef: { name: {{ $.Values.existingSecret | quote }}, key: {{ $key | quote }} } }
            {{- end }}
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: cache, mountPath: /app/apps/auth-broker/.next/cache }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: cache, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "patchbay-auth-broker.fullname" . }} }
spec: { selector: { app.kubernetes.io/name: patchbay-auth-broker }, ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }] }
{{- end }}
