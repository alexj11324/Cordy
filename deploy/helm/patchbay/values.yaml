# -----------------------------------------------------------------------------
# Container images
# -----------------------------------------------------------------------------
images:
  backend:
    repository: ghcr.io/alexj11324/patchbay-backend
    # Empty defaults to Chart.appVersion. Released OCI charts set appVersion to
    # the Git tag (for example v0.3.5), so installs use matching app images.
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/alexj11324/patchbay-web
    # Empty defaults to Chart.appVersion. Set explicitly to override.
    tag: ""
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Pre-created Secret with sensitive values. Create it before `helm install`:
#
# Built-in postgres (default):
#   kubectl -n <namespace> create secret generic patchbay-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=RESEND_API_KEY="" \
#     --from-literal=CLERK_SECRET_KEY="" \
#     --from-literal=CLERK_JWT_KEY="" \
#     --from-literal=CLOUDFRONT_PRIVATE_KEY="" \
#     --from-literal=PATCHBAY_ENTITLEMENT_SERVICE_TOKEN="" \
#     --from-literal=PATCHBAY_DEV_VERIFICATION_CODE=""
#
# External postgres (postgres.external.enabled=true):
#   Replace POSTGRES_PASSWORD with DATABASE_URL pointing at your external cluster.
#   kubectl -n <namespace> create secret generic patchbay-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgres://user:pass@host:5432/patchbay?sslmode=require" \
#     --from-literal=RESEND_API_KEY="" \
#     --from-literal=CLERK_SECRET_KEY="" \
#     --from-literal=CLERK_JWT_KEY="" \
#     --from-literal=CLOUDFRONT_PRIVATE_KEY="" \
#     --from-literal=PATCHBAY_ENTITLEMENT_SERVICE_TOKEN="" \
#     --from-literal=PATCHBAY_DEV_VERIFICATION_CODE=""
#
# The chart references this Secret by name; it does not template it, so real
# values never need to land in git.
# -----------------------------------------------------------------------------
existingSecret: patchbay-secrets

# -----------------------------------------------------------------------------
# PostgreSQL (pgvector)
# -----------------------------------------------------------------------------
postgres:
  # Set external.enabled=true to skip the built-in postgres Deployment/PVC and
  # supply DATABASE_URL directly via the existingSecret instead. When true,
  # the postgres Deployment, PVC, and Service are not created.
  # Add DATABASE_URL to your existingSecret pointing at the external cluster.
  external:
    enabled: false
  database: patchbay
  user: patchbay
  # Keep the database/role recorded by an existing release ConfigMap. Set false
  # only after explicitly migrating the live PostgreSQL database and role.
  preserveExistingIdentity: true
  persistence:
    size: 10Gi
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the postgres Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Backend (Rust API + WS server)
# -----------------------------------------------------------------------------
backend:
  redis:
    # Desktop handoff codes use REDIS_URL as their shared one-time grant store.
    # Keep this false for the default single backend pod. Set it to true before
    # increasing backend.replicas; the existing Secret must then contain the
    # key below, or Kubernetes will keep the backend pods from starting.
    enabled: false
    secretKey: REDIS_URL
  # Concurrent backend pods are now safe to start: patchbay-migrate uses a
  # Postgres session-level advisory lock to serialize the startup
  # `migrate up` run, so late-arriving pods queue and then no-op (see
  # GitHub issue 3647). 1 is still the recommended default
  # because the chart Deployment uses strategy: Recreate and there is no
  # leader-elected workload split — increase this only if you actually
  # need horizontal scale of the API/WS server. Horizontal scale also requires
  # backend.redis.enabled so browser-issued Desktop handoff codes can be
  # redeemed through any replica.
  replicas: 1
  uploads:
    persistence:
      # When true (default) the chart provisions a PersistentVolumeClaim for
      # /app/data/uploads and mounts it into the backend pod. The backend only
      # uses this directory when S3 is NOT configured (`backend.config.s3Bucket`
      # empty) — see server-rs/crates/patchbay-server/src/main.rs for the storage
      # selection.
      #
      # Set to false when you have configured S3/CloudFront and don't want the
      # chart to declare the uploads PVC at all. The default access mode is
      # ReadWriteOnce, which prevents `backend.replicas > 1` from scheduling a
      # second pod (Multi-Attach error); disabling persistence — or switching
      # accessModes to a ReadWriteMany class — removes that constraint on the
      # storage side. Startup migrations are serialized by the advisory lock
      # described above; uploads still require shared storage for replicas > 1.
      enabled: true
      size: 5Gi
      # Leave empty to use the cluster's default StorageClass.
      storageClass: ""
      # PVC accessModes. Defaults to [ReadWriteOnce] to match the typical
      # local-path / hostPath / EBS StorageClass on a single-node setup. Switch
      # to [ReadWriteMany] (with a compatible StorageClass such as NFS, EFS,
      # CephFS) if you intend to share the uploads volume across multiple
      # backend replicas without S3.
      accessModes:
        - ReadWriteOnce
  # All non-secret backend env. Secret values come from `existingSecret`.
  config:
    appEnv: production
    appUrl: http://patchbay.dev.lan
    frontendOrigin: http://patchbay.dev.lan
    corsAllowedOrigins: ""
    cookieDomain: ""
    resendFromEmail: noreply@patchbay.ai
    allowSignup: true
    allowedEmails: ""
    allowedEmailDomains: ""
    # Self-host gate (#3433): set true to make POST /api/workspaces 403 for
    # every caller. Bootstrap the workspace with this false, then flip to
    # true so users can only join via invitation.
    disableWorkspaceCreation: false
    # Self-host-only VCS integration (Forgejo / Gitea / GitLab). The official
    # chart enables the product surface by default; operators must also provide
    # PATCHBAY_VCS_SECRET_KEY through existingSecret before connections work.
    # Set false to hide and reject the integration for this deployment.
    vcsIntegrationEnabled: true
    # Managed Cloud policy consumer. The public/self-host chart keeps this off
    # by default, which also guarantees no quota-table access. To enable it,
    # set enabled=true and url to patchbay-cloud's HTTPS internal base URL, then
    # put a matching 32+ byte PATCHBAY_ENTITLEMENT_SERVICE_TOKEN in existingSecret.
    entitlementPolicy:
      enabled: false
      url: ""
      timeout: 3s
      staleGrace: 15m
      # Local down switch applied by the next chart rollout; it only forces off.
      emergencyDisabled: false
    # Clerk session verification. CLERK_SECRET_KEY and CLERK_JWT_KEY stay in
    # existingSecret; these origin values are safe deployment configuration.
    clerkIssuer: ""
    clerkAuthorizedParties: ""
    s3Bucket: ""
    s3Region: us-west-2
    cloudfrontDomain: ""
    cloudfrontKeyPairId: ""
    localUploadBaseUrl: http://api.patchbay.dev.lan
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the backend Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Frontend (Next.js standalone)
# -----------------------------------------------------------------------------
frontend:
  replicas: 1
  config:
    # Backend origin used by the frontend runtime proxy for /api, /auth,
    # /uploads, and /ws. Empty defaults to this release's backend Service.
    remoteApiUrl: ""
    # Optional docs origin used by the frontend runtime proxy for /docs.
    docsUrl: ""
    # Optional browser-visible split-origin overrides. Leave empty for the
    # default same-origin frontend proxy.
    publicApiUrl: ""
    publicWsUrl: ""
    # Clerk's publishable key is public. It must also be supplied when the
    # frontend image is built so the client bundle can initialize Clerk.
    clerkPublishableKey: ""
    clerkSignInUrl: /sign-in
    clerkSignUpUrl: /sign-up
  # Compatibility shim for legacy patchbay-web images built before runtime
  # URL rewrites. New images do not need this unprefixed Service.
  compatibility:
    # When true the chart creates an ExternalName Service literally named
    # "backend" for old images that baked REMOTE_API_URL=http://backend:8080.
    # Because that name is unprefixed, only ONE such release can run per
    # namespace. Keep false for current images.
    backendAlias: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Standard Kubernetes scheduling constraints for the frontend Deployment.
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  annotations: {}
  frontend:
    host: patchbay.dev.lan
    # Route other Web entrypoints to the same frontend Service. The canonical
    # hosted deployment adds accounts.aspectlylabs.com here while keeping
    # patchbay.aspectlylabs.com as the primary host.
    additionalHosts: []
  backend:
    host: api.patchbay.dev.lan
  # tls:
  #   - hosts: [patchbay.dev.lan, api.patchbay.dev.lan]
  #     secretName: patchbay-tls

# -----------------------------------------------------------------------------
# Monitoring
# -----------------------------------------------------------------------------
monitoring:
  prometheusRule:
    # Requires the Prometheus Operator CRD (monitoring.coreos.com/v1). Kept
    # disabled by default so minimal self-host installs without that CRD still
    # render and install.
    enabled: false
    additionalLabels: {}
    samplerQueryErrorsFor: 5m
    samplerQueryLatencyFor: 10m
    severity: warning
