version: 2

project_name: patchbay

builds:
  - id: patchbay
    main: ./cmd/patchbay
    dir: server
    binary: patchbay
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive name kept so already-released CLIs (whose `patchbay update`
  # looks for `patchbay_{os}_{arch}.{ext}`) can keep self-updating. Remove
  # once those versions are no longer in use.
  - id: legacy
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # prepare-release creates the one gated draft that already contains the
  # Desktop assets. Reuse it so CLI archives and checksums land in the same
  # release instead of a second hidden draft for the same tag.
  use_existing_draft: true

homebrew_casks:
  - name: patchbay
    ids:
      - versioned
    binaries:
      - patchbay
    repository:
      owner: alexj11324
      name: homebrew-tap
      branch: main
    directory: Casks
    # Publishing is intentionally separated from GoReleaser so the public tap
    # can never point at a draft release. The release workflow uploads this
    # generated cask only after it promotes the fully gated GitHub release.
    skip_upload: true
    homepage: "https://github.com/alexj11324/Cordy"
    description: "Patchbay CLI — local agent runtime and management tool for the Patchbay platform"
    # No license stanza: Patchbay ships under the Patchbay License (Apache 2.0
    # terms with additional conditions, see LICENSE), which has no SPDX
    # identifier, so declaring "Apache-2.0" here would be a false claim.
