# Oracle / aspectlylabs.com overrides: build from this checkout so the
# backend includes Clerk session exchange and the web image embeds the
# live publishable key. Ports stay on 3100/8180 via .env.
services:
  backend:
    image: aspectlylabs-backend:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PATCHBAY_IMAGE_TAG:-prod}
        COMMIT: unknown
        DATE: unknown

  frontend:
    image: aspectlylabs-web:prod
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${PATCHBAY_IMAGE_TAG:-prod}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
