name: Patchbay integration exact-head gate

on:
  push:
    branches:
      - codex/cord-14-s8-integrations

permissions:
  contents: write

jobs:
  smoke:
    if: "!startsWith(github.event.head_commit.message, 'ci(marker):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/cord-14-s8-integrations
      - name: Record successful runner execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "head=$(git rev-parse HEAD)" "status=ok" > .github/patchbay-integration-gate.marker
          git add .github/patchbay-integration-gate.marker
          git commit -m "ci(marker): integration runner executed"
          git push origin HEAD:codex/cord-14-s8-integrations
