name: macOS Desktop Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or pull-request ref to package (resolved to an immutable SHA)
        required: true
        default: main
        type: string
      arch:
        description: macOS architecture to build
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
          - all

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ inputs.ref }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      package_matrix: ${{ steps.source.outputs.package_matrix }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable candidate commit
        id: source
        env:
          REQUESTED_ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          case "$REQUESTED_ARCH" in
            arm64)
              package_matrix='{"include":[{"runner":"macos-14","arch":"arm64","rust_target":"aarch64-apple-darwin"}]}'
              ;;
            x64)
              package_matrix='{"include":[{"runner":"macos-15-intel","arch":"x64","rust_target":"x86_64-apple-darwin"}]}'
              ;;
            all)
              package_matrix='{"include":[{"runner":"macos-14","arch":"arm64","rust_target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","arch":"x64","rust_target":"x86_64-apple-darwin"}]}'
              ;;
            *)
              echo "::error::Unsupported candidate architecture: $REQUESTED_ARCH"
              exit 1
              ;;
          esac
          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "package_matrix=$package_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate source: $commit_sha"

  package:
    name: Package macOS candidate (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout immutable candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify candidate commit
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Candidate checkout changed from $EXPECTED_COMMIT to $actual_commit."
            exit 1
          fi

      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.rust_target }}"

      - name: Restore Cargo registry and git downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-candidate-cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: macos-candidate-cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned macOS candidate
        working-directory: apps/desktop
        env:
          # Candidate workflows never receive production signing or
          # notarization credentials. electron-builder uses its local/ad-hoc
          # path, which is sufficient for internal installation smoke tests.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --mac --${{ matrix.arch }} --publish never

      - name: Write candidate manifest and checksums
        working-directory: apps/desktop
        env:
          CANDIDATE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
          CANDIDATE_RUST_TARGET: ${{ matrix.rust_target }}
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'Patchbay.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::Packaged Patchbay.app was not found."
            exit 1
          fi
          version="$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')"
          printf '{"schemaVersion":1,"commit":"%s","version":"%s","platform":"darwin","arch":"%s","rustTarget":"%s"}\n' \
            "$CANDIDATE_COMMIT" "$version" "$CANDIDATE_ARCH" "$CANDIDATE_RUST_TARGET" \
            > dist/candidate-manifest.json
          checksums="$RUNNER_TEMP/SHA256SUMS.txt"
          : > "$checksums"
          for asset in dist/*; do
            if [ -f "$asset" ]; then
              shasum -a 256 "$asset" >> "$checksums"
            fi
          done
          mv "$checksums" dist/SHA256SUMS.txt
          {
            echo "### macOS candidate"
            echo "- Commit: $CANDIDATE_COMMIT"
            echo "- Architecture: $CANDIDATE_ARCH"
            echo "- App bundle: $app_path"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patchbay-desktop-candidate-${{ needs.prepare.outputs.short_sha }}-mac-${{ matrix.arch }}
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 14
