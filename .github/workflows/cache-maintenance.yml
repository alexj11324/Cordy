name: Cache maintenance

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cache-maintenance-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  maintain-actions-caches:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number) ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # Always execute repository-owned code from main. A workflow with
      # actions:write must never check out the closed pull request's head.
      - name: Checkout trusted cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Resolve cache cleanup mode and ref
        id: cleanup
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "mode=delete-ref" >> "$GITHUB_OUTPUT"
            echo "ref=refs/pull/$CLOSED_PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          elif [ "$RUN_EVENT" = "pull_request" ] && [ -n "$RUN_PR_NUMBER" ]; then
            pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RUN_PR_NUMBER" --jq '.state')"
            if [ "$pr_state" = "closed" ]; then
              echo "mode=delete-ref" >> "$GITHUB_OUTPUT"
            else
              echo "mode=prune-pr" >> "$GITHUB_OUTPUT"
            fi
            echo "ref=refs/pull/$RUN_PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          elif [ "$RUN_EVENT" = "push" ]; then
            echo "mode=prune-main" >> "$GITHUB_OUTPUT"
            echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to resolve a trusted cache scope from the event payload."
            exit 1
          fi

      - name: Prune bounded cache scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ steps.cleanup.outputs.mode }}
          CACHE_REF: ${{ steps.cleanup.outputs.ref }}
        run: |
          args=(--mode "$CLEANUP_MODE" --ref "$CACHE_REF")
          if [ "$CLEANUP_MODE" = "prune-main" ]; then
            args+=(--keep 2)
          fi
          node scripts/cleanup-actions-caches.mjs "${args[@]}"
