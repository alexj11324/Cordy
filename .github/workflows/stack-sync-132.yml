name: One-shot stack sync 132

on:
  push:
    branches:
      - automation/stack-sync-132

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cord-14-s8-integrations
          fetch-depth: 0

      - name: Merge main and preserve reviewed stack fixes
        shell: bash
        run: |
          set -euo pipefail
          expected=ef7e3ba9da342ca4deb4bd12d21a3c60a170c713
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "integration head moved: expected $expected, got $actual" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main

          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path: str) -> tuple[Path, str]:
              target = Path(path)
              return target, target.read_text()

          def save(target: Path, text: str) -> None:
              target.write_text(text)

          # Keep the evolved login-cookie implementation, but install the
          # reviewed singleton config and strict Domain validation from #31.
          target, text = load("server-rs/crates/cordy-auth/src/cookie.rs")
          if "static COOKIE_SETTINGS" not in text:
              marker = "static AUTH_TOKEN_TTL_SECS: OnceLock<i64> = OnceLock::new();\n\ntype HmacSha256 = Hmac<Sha256>;"
              replacement = """static AUTH_TOKEN_TTL_SECS: OnceLock<i64> = OnceLock::new();
          static COOKIE_SETTINGS: OnceLock<CookieSettings> = OnceLock::new();

          #[derive(Debug)]
          struct CookieSettings {
              domain: Option<String>,
              secure: bool,
          }

          type HmacSha256 = Hmac<Sha256>;"""
              if marker not in text:
                  raise SystemExit("cookie settings insertion marker not found")
              text = text.replace(marker, replacement, 1)

          if "COOKIE_DOMAIN is not a valid DNS domain" not in text:
              domain_impl = """pub fn cookie_domain(raw: Option<&str>) -> Option<String> {
              let raw = raw?.trim();
              if raw.is_empty() {
                  return None;
              }
              let bare = raw.strip_prefix('.').unwrap_or(raw);
              let valid = bare.len() <= 253
                  && !bare.is_empty()
                  && !bare.ends_with('.')
                  && bare.parse::<std::net::IpAddr>().is_err()
                  && bare.split('.').all(|label| {
                      label.len() <= 63
                          && !label.is_empty()
                          && label
                              .as_bytes()
                              .first()
                              .is_some_and(u8::is_ascii_alphanumeric)
                          && label
                              .as_bytes()
                              .last()
                              .is_some_and(u8::is_ascii_alphanumeric)
                          && label
                              .bytes()
                              .all(|byte| byte.is_ascii_alphanumeric() || byte == b'-')
                  });
              if !valid {
                  tracing::warn!(
                      value = %raw,
                      "COOKIE_DOMAIN is not a valid DNS domain; omitting the Domain attribute"
                  );
                  return None;
              }
              Some(raw.to_string())
          }"""
              pattern = re.compile(
                  r"pub fn cookie_domain\(raw: Option<&str>\) -> Option<String> \{.*?\n\}\n(?=\n/// Session cookies)",
                  re.S,
              )
              text, count = pattern.subn(domain_impl + "\n", text, count=1)
              if count != 1:
                  raise SystemExit("cookie domain implementation marker not found")

          if "pub fn configure_cookie_settings" not in text:
              marker = "/// Values for the two `Set-Cookie` headers that clear the session and CSRF"
              settings_impl = """/// Installs the merged TOML/environment cookie settings during startup.
          pub fn configure_cookie_settings(
              domain: Option<&str>,
              frontend_origin: Option<&str>,
          ) -> anyhow::Result<()> {
              COOKIE_SETTINGS
                  .set(CookieSettings {
                      domain: cookie_domain(domain),
                      secure: is_secure_cookie(frontend_origin),
                  })
                  .map_err(|_| anyhow::anyhow!("cookie settings were already initialized"))
          }

          fn effective_cookie_settings() -> &'static CookieSettings {
              COOKIE_SETTINGS.get_or_init(|| {
                  let domain = std::env::var("COOKIE_DOMAIN").ok();
                  let frontend_origin = std::env::var("FRONTEND_ORIGIN").ok();
                  CookieSettings {
                      domain: cookie_domain(domain.as_deref()),
                      secure: is_secure_cookie(frontend_origin.as_deref()),
                  }
              })
          }

          pub fn configured_cookie_domain() -> Option<&'static str> {
              effective_cookie_settings().domain.as_deref()
          }

          pub fn configured_secure_cookie() -> bool {
              effective_cookie_settings().secure
          }

          """
              if marker not in text:
                  raise SystemExit("cookie helper insertion marker not found")
              text = text.replace(marker, settings_impl + marker, 1)
          save(target, text)

          # Logout must consume the loaded configuration while preserving the
          # later CloudFront-cookie clearing behavior.
          target, text = load("server-rs/crates/cordy-handler/src/session.rs")
          old = """    let domain_raw = std::env::var("COOKIE_DOMAIN").ok();
              let domain = cordy_auth::cookie::cookie_domain(domain_raw.as_deref());
              let frontend_origin = std::env::var("FRONTEND_ORIGIN").ok();
              let secure = cordy_auth::cookie::is_secure_cookie(frontend_origin.as_deref());
          """
          new = """    let domain = cordy_auth::cookie::configured_cookie_domain();
              let secure = cordy_auth::cookie::configured_secure_cookie();
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif "configured_cookie_domain" not in text:
              raise SystemExit("logout cookie configuration marker not found")
          text = text.replace(
              "clear_auth_cookie_values(domain.as_deref(), secure)",
              "clear_auth_cookie_values(domain, secure)",
              1,
          )
          save(target, text)

          # Install those effective cookie settings once, beside the already
          # installed JWT secret and auth-token TTL.
          target, text = load("server-rs/crates/cordy-server/src/main.rs")
          if "configure_cookie_settings" not in text:
              marker = "    cordy_auth::cookie::configure_auth_token_ttl(cfg.auth.auth_token_ttl.as_deref())?;\n"
              insertion = """    cordy_auth::cookie::configure_cookie_settings(
              cfg.auth.cookie_domain.as_deref(),
              cfg.urls.frontend_origin.as_deref(),
          )?;
          """
              if marker not in text:
                  raise SystemExit("server auth configuration marker not found")
              text = text.replace(marker, marker + insertion, 1)
          save(target, text)

          # Preserve all later onboarding routes while repairing profile avatar
          # capabilities and accepting newer trusted system tzdata safely.
          target, text = load("server-rs/crates/cordy-handler/src/me.rs")
          if "use std::io::Read;" not in text:
              marker = "use structured_email_address::{Config as EmailConfig, EmailAddress};\nuse uuid::Uuid;"
              replacement = """use std::io::Read;
          use std::path::{Component, Path};
          use structured_email_address::{Config as EmailConfig, EmailAddress};
          use uuid::Uuid;"""
              if marker not in text:
                  raise SystemExit("profile import marker not found")
              text = text.replace(marker, replacement, 1)

          if "SYSTEM_ZONEINFO_ROOTS" not in text:
              marker = "const MAX_PROFILE_DESCRIPTION_LEN: usize = 2_000;\n"
              insertion = """const SYSTEM_ZONEINFO_ROOTS: [&str; 3] = [
              "/usr/share/zoneinfo",
              "/usr/share/lib/zoneinfo",
              "/etc/zoneinfo",
          ];
          """
              if marker not in text:
                  raise SystemExit("profile constants marker not found")
              text = text.replace(marker, marker + insertion, 1)

          if "fn from_user(state: &HandlerState" not in text:
              marker = "\n\nasync fn get_me"
              index = text.find(marker)
              if index < 0:
                  raise SystemExit("profile response implementation marker not found")
              implementation = """

          impl UserResponse {
              fn from_user(state: &HandlerState, user: &User) -> Self {
                  let mut response = Self::from(user);
                  response.avatar_url = user
                      .avatar_url
                      .as_deref()
                      .map(|url| crate::avatar::resolve_url(state, url));
                  response
              }
          }"""
              text = text[:index] + implementation + text[index:]

          text = text.replace(
              "Json(UserResponse::from(&user)).into_response()",
              "Json(UserResponse::from_user(&state, &user)).into_response()",
          )
          text = text.replace(
              "Json(UserResponse::from(&updated)).into_response()",
              "Json(UserResponse::from_user(&state, &updated)).into_response()",
          )

          old_avatar = "    let avatar_url = request.avatar_url.map(|value| value.trim().to_string());\n"
          new_avatar = """    let avatar_url = match request.avatar_url {
              Some(value) => match crate::avatar::accept_url(
                  &state,
                  &value,
                  current_user.avatar_url.as_deref(),
              )
              .await
              {
                  Ok(value) => Some(value),
                  Err(message) => return error_response(StatusCode::BAD_REQUEST, message),
              },
              None => None,
          };
          """
          if old_avatar in text:
              text = text.replace(old_avatar, new_avatar, 1)
          elif "crate::avatar::accept_url" not in text:
              raise SystemExit("profile avatar update marker not found")

          old_timezone = "            if !timezone.is_empty() && timezone.parse::<Tz>().is_err() {\n"
          new_timezone = "            if !timezone.is_empty() && !valid_timezone(&timezone) {\n"
          if old_timezone in text:
              text = text.replace(old_timezone, new_timezone, 1)
          elif "!valid_timezone(&timezone)" not in text:
              raise SystemExit("profile timezone validation marker not found")

          if "fn valid_timezone_with_roots" not in text:
              marker = "fn valid_email_address(value: &str) -> bool {"
              implementation = """fn valid_timezone(timezone: &str) -> bool {
              let roots: Vec<&Path> = SYSTEM_ZONEINFO_ROOTS.iter().map(Path::new).collect();
              valid_timezone_with_roots(timezone, &roots)
          }

          fn valid_timezone_with_roots(timezone: &str, roots: &[&Path]) -> bool {
              if timezone.parse::<Tz>().is_ok() {
                  return true;
              }
              let relative = Path::new(timezone);
              if timezone.is_empty()
                  || relative.is_absolute()
                  || relative
                      .components()
                      .any(|component| !matches!(component, Component::Normal(_)))
              {
                  return false;
              }
              roots.iter().any(|root| {
                  let Ok(mut file) = std::fs::File::open(root.join(relative)) else {
                      return false;
                  };
                  let mut magic = [0_u8; 4];
                  file.read_exact(&mut magic).is_ok() && &magic == b"TZif"
              })
          }

          """
              if marker not in text:
                  raise SystemExit("profile timezone helper marker not found")
              text = text.replace(marker, implementation + marker, 1)

          old_test = """        assert!("America/New_York".parse::<Tz>().is_ok());
              assert!("not/a-timezone".parse::<Tz>().is_err());
          """
          new_test = """        assert!(valid_timezone("America/New_York"));
              assert!(!valid_timezone("not/a-timezone"));
          """
          if old_test in text:
              text = text.replace(old_test, new_test, 1)

          if "timezone_validation_can_use_newer_system_tzdata_safely" not in text:
              marker = """    #[test]
              fn profile_description_limit_counts_unicode_characters() {
          """
              test = """    #[test]
              fn timezone_validation_can_use_newer_system_tzdata_safely() {
                  let root = std::env::temp_dir().join(format!("cordy-zoneinfo-{}", Uuid::new_v4()));
                  let zone = root.join("Test/New_Zone");
                  std::fs::create_dir_all(zone.parent().unwrap()).unwrap();
                  std::fs::write(&zone, b"TZif2").unwrap();

                  assert!(valid_timezone_with_roots(
                      "Test/New_Zone",
                      &[root.as_path()]
                  ));
                  assert!(!valid_timezone_with_roots(
                      "../Test/New_Zone",
                      &[root.as_path()]
                  ));
                  assert!(!valid_timezone_with_roots(
                      "/Test/New_Zone",
                      &[root.as_path()]
                  ));

                  std::fs::remove_dir_all(root).unwrap();
              }

          """
              if marker not in text:
                  raise SystemExit("profile timezone test marker not found")
              text = text.replace(marker, test + marker, 1)

          save(target, text)
          PY

          rustfmt --edition 2021 \
            server-rs/crates/cordy-auth/src/cookie.rs \
            server-rs/crates/cordy-handler/src/session.rs \
            server-rs/crates/cordy-handler/src/me.rs \
            server-rs/crates/cordy-server/src/main.rs
          git diff --check
          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo check \
            --manifest-path server-rs/Cargo.toml \
            --locked \
            -p cordy-auth \
            -p cordy-handler \
            -p cordy-server

          git add -A
          git commit -m "chore(stack): sync main auth and profile fixes"
          git push origin HEAD:codex/cord-14-s8-integrations
