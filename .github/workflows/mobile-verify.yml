name: Mobile Verify

# Runs lint + typecheck for apps/mobile only. Like the main CI workflow, it is
# intentionally manual so GitHub-hosted runner usage stays predictable; select
# the branch to validate from the Actions page.
#
# The workflow validates mobile and everything mobile transitively depends on:
# - apps/mobile/**                — the app itself
# - packages/core/**              — mobile imports types AND pure functions
#                                   (agents, markdown, permissions, api/schemas, …),
#                                   not only @cordy/core/types
# - package.json / pnpm-lock.yaml — install graph
# - pnpm-workspace.yaml           — catalog versions
# - turbo.json                    — turbo task pipeline
#
# Mobile's vitest suite is intentionally narrow (Node env, pure-function
# tests under apps/mobile/lib/*.test.ts — see apps/mobile/vitest.config.ts).
# RN component-level rendering is not exercised here.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint, and test
        run: pnpm exec turbo typecheck lint test --filter=@cordy/mobile
