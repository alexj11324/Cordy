name: Remediation smoke
on:
  push:
    branches: [remediation/review-debt-20260824]
permissions:
  contents: write
jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/review-debt-20260824
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "runner-ok $(date -u +%FT%TZ)" > .remediation-runner-ok
          git add .remediation-runner-ok
          git commit -m 'ci: confirm remediation runner' || true
          git push origin HEAD:remediation/review-debt-20260824
