name: Targeted review remediation

on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: targeted-review-remediation-135
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'remediation/review-debt-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/review-debt-20260824
          fetch-depth: 0

      - name: Apply validated historical review fixes
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -q '^\[targeted-remediation\]'; then
            echo 'targeted remediation already applied; validating current head only'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune

          # These are repository-local fixes that were written specifically for
          # review findings in the S8 stack. Apply only clean three-way patches;
          # conflicts are left for current-tree remediation below.
          commits=(
            156c466c7e820a364a078eee21ba9dd9d773b73e
            119bf7fe7953b192f8a7707ede9868d75a775ddc
            c984d7486b9b0ca2797e170d48c8042776f1da49
            78aed98e1dafb1072b8a12e9a66fc93f6b242124
            13facae967658456a4681c920b3265432f485fbf
            bb6041e7271419a7fe5c52f1e8083dc043db0290
            c3ae5f948fe5f5b09f62280ab95528fcc97ea72b
            881da969d4d1357553a86115ffe6e17f21c671e8
            2f0c54594f0755a2327da2232e744dbea7805043
            5402efab8930fbdb408a787fef19bacb4988a77d
            ed95d6ef3639bcfdad28a57a81f198ec64dbe23e
            2513d90c12656e9549a18ac6b360d199c10e8fe0
            5a450533bb8e6ab4f2085d37ac034d2b93463849
            41eed2a2918ec798c202e8719e86f429f0ee5cd9
            27f93aab3596c85b1fca52492a113ebe7df3ccc5
            301f3ce4bf9356cc9396a8eb6d3b9755e3d1226e
            9f2ed44a08270c58c1cf40f623130425e1096c20
            31c7080227b81bba523a91b709eba39359745d66
            33664841ec8733a2601a702af360607304361c88
            640f0363ca6de387a695171189325cccc9444a18
            d9b0dcb0c0d43a7ed929575adf9fb7b1fd673dfd
            207644752780713f5ca136f00e6bae6dbdffd6ba
            ff5ecd55a8aa27d249bf6203dd4e913bfb0031d2
            d5356dc2f1890a8c02917169f37862ad340d37c5
            82b9c31fd12139cdc10a57340bb0a6cc26c741e1
            06a740174c86a172147e5df6a65aa051e2f8011b
            3d5bd0f297658d614cae20a3efd5bb6f6fe72340
            80ef7843999b5ed9ec0af5910e6e4470c5e0f168
            076aeaffb4381a72758a5e418e7870fbab3a8589
            a4b4df848d7c64c8f676054c638ef105fc8ea7fa
            cd3178883ebc6f6c41d0a1bf94647d0a0bd320a1
            a9c2b4dbe0aacb442886a6dd92a253bef4b0ab5c
            c2f6c460a60c086881ec1d34d34046fd0462eb08
            1e9c8ee733a3d6197eae00df8c343ed5a175fbe5
            0155b4b6f78c33fd7114c7e67ca06ffd7bd50f50
            097a5dece80502cf3622e5f59969d1a44718d3a1
            9ffefc7780090484dad6b7d9257a05172f906587
            a87b8d5929c1f4a7633dfa63fd6a561e13e47e53
            905efd5e6228bc652251e0b07fa808d2ddafefbf
            e2928b13549ba77f5f6ddc58932db6a5318070d6
          )

          : > /tmp/targeted-remediation.txt
          for commit in "${commits[@]}"; do
            subject=$(git show -s --format=%s "$commit" 2>/dev/null || true)
            if git cherry-pick -x "$commit"; then
              echo "APPLIED $commit $subject" | tee -a /tmp/targeted-remediation.txt
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [[ -z "$conflicts" ]]; then
              git cherry-pick --abort >/dev/null 2>&1 || git cherry-pick --skip >/dev/null 2>&1 || true
              echo "EMPTY $commit $subject" | tee -a /tmp/targeted-remediation.txt
            else
              git cherry-pick --abort
              echo "CONFLICT $commit $subject :: $conflicts" | tee -a /tmp/targeted-remediation.txt
            fi
          done

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, required=False):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
                  return False
              p.write_text(text.replace(old, new, 1))
              return True

          # Profile avatar writes: validate ownership, preserve 403, while
          # keeping timezone validation aligned to chrono_tz consumers.
          me = Path('server-rs/crates/cordy-handler/src/me.rs')
          text = me.read_text()
          old_avatar = '    let avatar_url = request.avatar_url.map(|value| value.trim().to_string());'
          new_avatar = '''    let avatar_url = match request.avatar_url {\n        Some(value) => match crate::avatar::accept_url(\n            &state,\n            &value,\n            current_user.avatar_url.as_deref(),\n        )\n        .await\n        {\n            Ok(value) => Some(value),\n            Err(message) => return error_response(StatusCode::FORBIDDEN, message),\n        },\n        None => None,\n    };'''
          if old_avatar in text:
              text = text.replace(old_avatar, new_avatar, 1)
          text = text.replace(
              'Err(message) => return error_response(StatusCode::BAD_REQUEST, message),\n        },\n        None => None,\n    };\n    let language = match request.language',
              'Err(message) => return error_response(StatusCode::FORBIDDEN, message),\n        },\n        None => None,\n    };\n    let language = match request.language',
              1,
          )
          if 'struct JoinCloudWaitlistRequest {' in text and 'deserialize_null_string' not in text:
              text = text.replace(
                  '#[derive(Debug, Default, Deserialize)]\nstruct JoinCloudWaitlistRequest {\n    #[serde(default)]\n    email: String,\n    #[serde(default)]\n    reason: String,\n}',
                  '#[derive(Debug, Default, Deserialize)]\nstruct JoinCloudWaitlistRequest {\n    #[serde(default, deserialize_with = "deserialize_null_string")]\n    email: String,\n    #[serde(default, deserialize_with = "deserialize_null_string")]\n    reason: String,\n}',
                  1,
              )
              marker = 'fn deserialize_string_or_slice<'
              helper = '''fn deserialize_null_string<'de, D>(deserializer: D) -> Result<String, D::Error>\nwhere\n    D: serde::Deserializer<'de>,\n{\n    Option::<String>::deserialize(deserializer).map(Option::unwrap_or_default)\n}\n\n'''
              text = text.replace(marker, helper + marker, 1)
          me.write_text(text)

          # Capability URLs must be absolute when public URL came from TOML.
          avatar = Path('server-rs/crates/cordy-handler/src/avatar.rs')
          text = avatar.read_text()
          old = '''fn served_url(key: &str) -> String {\n    let path = format!("/api/avatars/{}/{key}", sign_key(key));\n    let base = std::env::var("CORDY_PUBLIC_URL")\n        .unwrap_or_default()\n        .trim()\n        .trim_end_matches('/')\n        .to_string();\n    if base.is_empty() {\n        path\n    } else {\n        format!("{base}{path}")\n    }\n}'''
          new = '''fn served_url(state: &HandlerState, key: &str) -> String {\n    let path = format!("/api/avatars/{}/{key}", sign_key(key));\n    let configured = state.attachment_download.public_url.trim().trim_end_matches('/');\n    let env_base = std::env::var("CORDY_PUBLIC_URL").unwrap_or_default();\n    let base = if configured.is_empty() { env_base.trim().trim_end_matches('/') } else { configured };\n    if base.is_empty() { path } else { format!("{base}{path}") }\n}'''
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace('return served_url(&key);', 'return served_url(state, &key);')
              text = text.replace('served_url(&key)\n}', 'served_url(state, &key)\n}')
          avatar.write_text(text)

          # Use the row actually protected by FOR UPDATE when an update leaves
          # the leader unchanged.
          squad = Path('server-rs/crates/cordy-handler/src/squad.rs')
          text = squad.read_text()
          old = '''    match squad::lock_squad_for_update(&mut *transaction, existing.id, context.member.workspace_id)\n        .await\n    {\n        Ok(Some(_)) => {}\n        Ok(None) | Err(_) => {\n            return error_response(StatusCode::INTERNAL_SERVER_ERROR, "failed to update squad")\n        }\n    }\n    let mut leader_id = existing.leader_id;'''
          new = '''    let locked = match squad::lock_squad_for_update(\n        &mut *transaction,\n        existing.id,\n        context.member.workspace_id,\n    )\n    .await\n    {\n        Ok(Some(locked)) => locked,\n        Ok(None) | Err(_) => {\n            return error_response(StatusCode::INTERNAL_SERVER_ERROR, "failed to update squad")\n        }\n    };\n    let mut leader_id = locked.leader_id;'''
          if old in text:
              text = text.replace(old, new, 1)
          squad.write_text(text)

          # Squad deletion changes Autopilot assignees; one squad event should
          # invalidate both issue and Autopilot projections.
          rt = Path('packages/core/realtime/use-realtime-sync.ts')
          text = rt.read_text()
          old = '''          // squad:deleted triggers assignee transfer — refresh issues too.\n          qc.invalidateQueries({ queryKey: issueKeys.all(wsId) });'''
          new = '''          // squad:deleted triggers assignee transfer — refresh issues and autopilots too.\n          qc.invalidateQueries({ queryKey: issueKeys.all(wsId) });\n          qc.invalidateQueries({ queryKey: autopilotKeys.all(wsId) });'''
          if old in text:
              text = text.replace(old, new, 1)
          rt.write_text(text)

          # Complete-tree skill downloads must enforce the aggregate bundle cap
          # while results stream in, not after retaining all bodies.
          skill = Path('server-rs/crates/cordy-handler/src/skill_import.rs')
          text = skill.read_text()
          old = '''    let downloads = stream::iter(\n        files\n            .into_iter()\n            .map(|(repo_path, relative, _)| async move {\n                let url = raw_url_for(prefix, &repo_path)?;\n                let bytes = fetch_bytes(client, url, true).await?;\n                Ok::<_, ImportError>((relative, String::from_utf8_lossy(&bytes).into_owned()))\n            }),\n    )\n    .buffered(DOWNLOAD_CONCURRENCY)\n    .collect::<Vec<_>>()\n    .await;\n    for result in downloads {\n        let (path, content) = result?;\n        imported.add_file(path, content)?;\n    }'''
          new = '''    let mut downloads = stream::iter(\n        files\n            .into_iter()\n            .map(|(repo_path, relative, _)| async move {\n                let url = raw_url_for(prefix, &repo_path)?;\n                let bytes = fetch_bytes(client, url, true).await?;\n                Ok::<_, ImportError>((relative, String::from_utf8_lossy(&bytes).into_owned()))\n            }),\n    )\n    .buffered(DOWNLOAD_CONCURRENCY);\n    while let Some(result) = downloads.next().await {\n        let (path, content) = result?;\n        imported.add_file(path, content)?;\n    }'''
          if old in text:
              text = text.replace(old, new, 1)
          # Trim deployment-supplied GitHub tokens before HeaderValue creation.
          text = text.replace('request = request.bearer_auth(token);', 'request = request.bearer_auth(token.trim());')
          skill.write_text(text)
          PY

          cargo fmt --manifest-path server-rs/Cargo.toml --all
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '[targeted-remediation] apply validated review fixes'
            git push origin HEAD:remediation/review-debt-20260824
          fi
          cat /tmp/targeted-remediation.txt

      - name: Validate Rust remediation
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test -p cordy-handler -p cordy-service -p cordy-server --locked
          cargo clippy -p cordy-handler -p cordy-service -p cordy-server -p cordy-cli --all-targets --locked -- -D warnings
