name: Container Images (manual publish)

on:
  workflow_dispatch:
    inputs:
      image:
        description: Production image to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - web
      source_ref:
        description: Git ref or commit SHA to publish (defaults to the workflow ref)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Resolve immutable source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend:
    if: ${{ inputs.image == 'all' || inputs.image == 'backend' }}
    needs: resolve-source
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        id: backend-buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Cargo image cache
        id: backend-cargo-cache
        uses: actions/cache@v6
        with:
          path: .buildkit-cache/backend
          key: buildkit-backend-${{ runner.os }}-${{ hashFiles('server-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            buildkit-backend-${{ runner.os }}-${{ hashFiles('server-rs/Cargo.lock') }}-
            buildkit-backend-${{ runner.os }}-

      - name: Mount Cargo cache in BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.backend-buildx.outputs.name }}
          cache-dir: .buildkit-cache/backend
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.backend-cargo-cache.outputs.cache-hit }}

      - name: Compute backend image date
        id: backend-image
        run: |
          SOURCE_SHA="${{ needs.resolve-source.outputs.sha }}"
          DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }}
          build-args: |
            VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT=${{ needs.resolve-source.outputs.sha }}
            DATE=${{ steps.backend-image.outputs.date }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

  web:
    if: ${{ inputs.image == 'all' || inputs.image == 'web' }}
    needs: resolve-source
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Clerk publishable key for web image
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Missing required web image secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DESKTOP_APP_ORIGIN=${{ vars.NEXT_PUBLIC_DESKTOP_APP_ORIGIN }}
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
