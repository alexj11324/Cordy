name: Container Images (manual publish)

on:
  workflow_dispatch:
    inputs:
      image:
        description: Production image to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - web
      source_ref:
        description: Git ref or commit SHA to publish (defaults to the workflow ref)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Resolve immutable source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend-build:
    if: ${{ inputs.image == 'all' || inputs.image == 'backend' }}
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        id: backend-buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Cargo image cache
        id: backend-cargo-cache
        uses: actions/cache@v6
        with:
          path: .buildkit-cache/backend
          key: buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ hashFiles('server-rs/Cargo.lock') }}-${{ needs.resolve-source.outputs.sha }}
          restore-keys: |
            buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ hashFiles('server-rs/Cargo.lock') }}-
            buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-

      - name: Mount Cargo cache in BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.backend-buildx.outputs.name }}
          cache-dir: .buildkit-cache/backend
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.backend-cargo-cache.outputs.cache-hit }}

      - name: Compute backend image date
        id: backend-image
        run: |
          SOURCE_SHA="${{ needs.resolve-source.outputs.sha }}"
          DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build production backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT=${{ needs.resolve-source.outputs.sha }}
            DATE=${{ steps.backend-image.outputs.date }}
          cache-from: type=gha,scope=ci-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ci-backend-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export backend digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload backend digest
        uses: actions/upload-artifact@v4
        with:
          name: manual-digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  backend-merge:
    if: ${{ inputs.image == 'all' || inputs.image == 'backend' }}
    needs: [resolve-source, backend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download backend digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: manual-digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected two backend image digests, found ${#digest_files[@]}"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-backend@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }} \
            "${digest_args[@]}"

      - name: Inspect backend manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }}

  web-build:
    if: ${{ inputs.image == 'all' || inputs.image == 'web' }}
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Clerk publishable key for web image
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Missing required web image secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DESKTOP_APP_ORIGIN=${{ vars.NEXT_PUBLIC_DESKTOP_APP_ORIGIN }}
          cache-from: type=gha,scope=ci-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ci-web-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export web digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload web digest
        uses: actions/upload-artifact@v4
        with:
          name: manual-digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  web-merge:
    if: ${{ inputs.image == 'all' || inputs.image == 'web' }}
    needs: [resolve-source, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download web digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: manual-digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish web multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected two web image digests, found ${#digest_files[@]}"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-web@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }} \
            "${digest_args[@]}"

      - name: Inspect web manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }}
