name: Container Images (manual publish)

on:
  workflow_dispatch:
    inputs:
      image:
        description: Production image to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - web
      source_ref:
        description: Git ref or commit SHA to publish (defaults to the workflow ref)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Resolve immutable source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend-build:
    if: ${{ inputs.image == 'all' || inputs.image == 'backend' }}
    needs: resolve-source
    concurrency:
      group: manual-container-backend-build-${{ needs.resolve-source.outputs.sha }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        id: backend-buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Cargo image cache
        id: backend-cargo-cache
        uses: actions/cache@v6
        with:
          path: .buildkit-cache/backend
          key: buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ hashFiles('server-rs/Cargo.lock') }}-${{ needs.resolve-source.outputs.sha }}
          restore-keys: |
            buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ hashFiles('server-rs/Cargo.lock') }}-
            buildkit-backend-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-

      - name: Mount Cargo cache in BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.backend-buildx.outputs.name }}
          cache-dir: .buildkit-cache/backend
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.backend-cargo-cache.outputs.cache-hit }}

      - name: Compute backend image date
        id: backend-image
        run: |
          SOURCE_SHA="${{ needs.resolve-source.outputs.sha }}"
          DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Build production backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT=${{ needs.resolve-source.outputs.sha }}
            DATE=${{ steps.backend-image.outputs.date }}
          cache-from: type=gha,scope=ci-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ci-backend-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export backend digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload backend digest
        uses: actions/upload-artifact@v4
        with:
          name: manual-digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  backend-merge:
    if: ${{ inputs.image == 'backend' }}
    needs: [resolve-source, backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: manual-container-publish-${{ needs.resolve-source.outputs.sha }}
      cancel-in-progress: false
    steps:
      - name: Download backend digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: manual-digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected two backend image digests, found ${#digest_files[@]}"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-backend@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }} \
            "${digest_args[@]}"

      - name: Inspect backend manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }}

  web-build:
    if: ${{ inputs.image == 'all' || inputs.image == 'web' }}
    needs: resolve-source
    concurrency:
      group: manual-container-web-build-${{ needs.resolve-source.outputs.sha }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Clerk publishable key for web image
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Missing required web image secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DESKTOP_APP_ORIGIN=${{ vars.NEXT_PUBLIC_DESKTOP_APP_ORIGIN }}
          cache-from: type=gha,scope=ci-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ci-web-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export web digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload web digest
        uses: actions/upload-artifact@v4
        with:
          name: manual-digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  web-merge:
    if: ${{ inputs.image == 'web' }}
    needs: [resolve-source, web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: manual-container-publish-${{ needs.resolve-source.outputs.sha }}
      cancel-in-progress: false
    steps:
      - name: Download web digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: manual-digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish web multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected two web image digests, found ${#digest_files[@]}"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-web@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }} \
            "${digest_args[@]}"

      - name: Inspect web manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }}

  publish-all:
    if: >-
      ${{
        always() &&
        inputs.image == 'all' &&
        needs.backend-build.result == 'success' &&
        needs.web-build.result == 'success'
      }}
    needs: [resolve-source, backend-build, web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: manual-container-publish-${{ needs.resolve-source.outputs.sha }}
      cancel-in-progress: false
    steps:
      - name: Download backend digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/backend
          pattern: manual-digests-backend-*
          merge-multiple: true

      - name: Download web digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/web
          pattern: manual-digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and verify paired manifests
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          verify_manifest() {
            local repository="$1"
            local digest_dir="$2"
            local label="$3"
            local digest_files=("$digest_dir"/*)
            if [ "${#digest_files[@]}" -ne 2 ]; then
              echo "::error::Expected two $label image digests, found ${#digest_files[@]}"
              return 1
            fi

            local digest_args=()
            local digest_file digest
            for digest_file in "${digest_files[@]}"; do
              digest="${digest_file##*/}"
              digest_args+=("$repository@sha256:$digest")
            done

            docker buildx imagetools create --dry-run \
              "${digest_args[@]}" >"/tmp/$label-manifest.json"
            jq -e \
              '.mediaType and (.manifests | type == "array") and (.manifests | length >= 2)' \
              "/tmp/$label-manifest.json" >/dev/null
          }

          backend_repository="ghcr.io/${{ github.repository_owner }}/patchbay-backend"
          web_repository="ghcr.io/${{ github.repository_owner }}/patchbay-web"
          verify_manifest \
            "$backend_repository" \
            /tmp/digests/backend \
            backend
          verify_manifest \
            "$web_repository" \
            /tmp/digests/web \
            web

      - name: Promote paired commit tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -Eeuo pipefail

          owner="${{ github.repository_owner }}"
          final_tag="sha-$SOURCE_SHA"
          backend_repository="ghcr.io/$owner/patchbay-backend"
          web_repository="ghcr.io/$owner/patchbay-web"
          backend_final="$backend_repository:$final_tag"
          web_final="$web_repository:$final_tag"
          owner_type="$(gh api "/users/$owner" --jq .type)"

          package_versions_endpoint() {
            local package="$1"
            if [ "$owner_type" = "Organization" ]; then
              printf '/orgs/%s/packages/container/%s/versions' "$owner" "$package"
            else
              printf '/users/%s/packages/container/%s/versions' "$owner" "$package"
            fi
          }

          find_tag_version_field() {
            local package="$1"
            local tag="$2"
            local field="$3"
            local endpoint page response match count
            endpoint="$(package_versions_endpoint "$package")"
            page=1
            while :; do
              if ! response="$(gh api "$endpoint?per_page=100&page=$page")"; then
                echo "::error::Failed to snapshot $package package versions" >&2
                return 1
              fi
              match="$(
                jq -r --arg tag "$tag" --arg field "$field" '
                  first(
                    .[] |
                    select((.metadata.container.tags // []) | index($tag)) |
                    if $field == "__json" then @json else .[$field] end
                  ) // empty
                ' <<<"$response"
              )"
              if [ -n "$match" ]; then
                printf '%s' "$match"
                return 0
              fi
              count="$(jq 'length' <<<"$response")"
              if [ "$count" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
          }

          find_digest_version_json() {
            local package="$1"
            local digest="$2"
            local endpoint page response match count
            endpoint="$(package_versions_endpoint "$package")"
            page=1
            while :; do
              if ! response="$(gh api "$endpoint?per_page=100&page=$page")"; then
                echo "::error::Failed to inspect $package package versions" >&2
                return 1
              fi
              match="$(
                jq -r --arg digest "$digest" '
                  first(.[] | select(.name == $digest) | @json) // empty
                ' <<<"$response"
              )"
              if [ -n "$match" ]; then
                printf '%s' "$match"
                return 0
              fi
              count="$(jq 'length' <<<"$response")"
              if [ "$count" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
          }

          manifest_digest() {
            local manifest_file="$1"
            printf '%s' "$(cat "$manifest_file")" | sha256sum | awk '{print "sha256:" $1}'
          }

          require_safe_new_tag() {
            local package="$1"
            local desired_digest="$2"
            local previous_digest="$3"
            local existing_version
            if [ -n "$previous_digest" ]; then
              return
            fi
            if ! existing_version="$(find_digest_version_json "$package" "$desired_digest")"; then
              return 1
            fi
            if [ -n "$existing_version" ]; then
              echo "::error::$package digest $desired_digest already exists while $final_tag is absent; refusing a promotion that cannot be rolled back safely" >&2
              return 1
            fi
          }

          publish_manifest() {
            local repository="$1"
            local digest_dir="$2"
            local final_ref="$3"
            local digest_files=("$digest_dir"/*)
            local digest_args=()
            local digest_file digest
            if [ "${#digest_files[@]}" -ne 2 ]; then
              echo "::error::Expected two image digests, found ${#digest_files[@]}"
              return 1
            fi
            for digest_file in "${digest_files[@]}"; do
              digest="${digest_file##*/}"
              digest_args+=("$repository@sha256:$digest")
            done
            docker buildx imagetools create \
              --tag "$final_ref" \
              "${digest_args[@]}"
          }

          restore_or_remove() {
            local repository="$1"
            local package="$2"
            local final_ref="$3"
            local previous_digest="$4"
            local endpoint version_json version_id other_tag_count
            if [ -n "$previous_digest" ]; then
              docker buildx imagetools create \
                --tag "$final_ref" \
                "$repository@$previous_digest"
              return
            fi

            if ! version_json="$(find_tag_version_field "$package" "$final_tag" __json)"; then
              echo "::error::Failed to inspect $package during rollback" >&2
              return 1
            fi
            if [ -z "$version_json" ]; then
              return
            fi

            other_tag_count="$(
              jq --arg final_tag "$final_tag" '
                [.metadata.container.tags[]? | select(. != $final_tag)] | length
              ' <<<"$version_json"
            )"
            if [ "$other_tag_count" -ne 0 ]; then
              echo "::error::$package version has aliases; refusing destructive rollback" >&2
              return 1
            fi

            version_id="$(jq -r .id <<<"$version_json")"
            endpoint="$(package_versions_endpoint "$package")"
            gh api -X DELETE "$endpoint/$version_id"
          }

          previous_backend="$(find_tag_version_field patchbay-backend "$final_tag" name)"
          previous_web="$(find_tag_version_field patchbay-web "$final_tag" name)"
          desired_backend="$(manifest_digest /tmp/backend-manifest.json)"
          desired_web="$(manifest_digest /tmp/web-manifest.json)"

          # If a desired manifest already exists under another tag (or untagged),
          # adding this SHA tag would alias a pre-existing package version. GHCR
          # cannot remove only that alias, so reject both images before either
          # final tag is mutated.
          require_safe_new_tag patchbay-backend "$desired_backend" "$previous_backend"
          require_safe_new_tag patchbay-web "$desired_web" "$previous_web"
          promotion_failed=0

          if ! publish_manifest \
            "$backend_repository" \
            /tmp/digests/backend \
            "$backend_final"; then
            promotion_failed=1
          fi
          if [ "$promotion_failed" -eq 0 ] &&
            ! publish_manifest \
              "$web_repository" \
              /tmp/digests/web \
              "$web_final"; then
            promotion_failed=1
          fi

          if [ "$promotion_failed" -ne 0 ]; then
            rollback_failed=0
            if ! restore_or_remove \
              "$backend_repository" \
              patchbay-backend \
              "$backend_final" \
              "$previous_backend"; then
              rollback_failed=1
            fi
            if ! restore_or_remove \
              "$web_repository" \
              patchbay-web \
              "$web_final" \
              "$previous_web"; then
              rollback_failed=1
            fi
            if [ "$rollback_failed" -ne 0 ]; then
              echo "::error::Paired image promotion and rollback both failed"
            else
              echo "::error::Paired image promotion failed and prior tags were restored"
            fi
            exit 1
          fi

      - name: Inspect paired commit manifests
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }}
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }}
