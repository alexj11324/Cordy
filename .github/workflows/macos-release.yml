name: macOS Desktop Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish (for example, v0.2.1)
        required: true
        type: string
      arch:
        description: macOS architecture to publish manually
        required: true
        default: all
        type: choice
        options:
          - arm64
          - x64
          - all

permissions:
  contents: write

concurrency:
  group: macos-desktop-release-${{ inputs.tag || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'patchbay-ai/patchbay' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v') &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.meta.outputs.should_publish }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      is_stable: ${{ steps.meta.outputs.is_stable }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      package_matrix: ${{ steps.meta.outputs.package_matrix }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve immutable release tag
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          release_arch="$REQUESTED_ARCH"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            mapfile -t matching_tags < <(
              git tag --points-at HEAD --list 'v*.*.*' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || true
            )
            if [ "${#matching_tags[@]}" -ne 1 ]; then
              echo "::notice::CI succeeded without exactly one version tag at $GITHUB_SHA; no macOS ARM64 release will be published."
              {
                echo "should_publish=false"
                echo 'package_matrix={"include":[]}'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="${matching_tags[0]}"
            release_arch=arm64
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::macOS release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$tag^{commit}")"
          if [ "$tag_commit" != "$commit_sha" ]; then
            echo "::error::Checked out commit '$commit_sha' does not match requested tag '$tag' ($tag_commit)."
            exit 1
          fi

          is_stable=true
          if [[ "$tag" == *-* ]]; then
            is_stable=false
          fi
          case "$release_arch" in
            arm64)
              package_matrix='{"include":[{"runner":"macos-14","arch":"arm64","rust_target":"aarch64-apple-darwin","metadata":"latest-mac.yml"}]}'
              ;;
            x64)
              package_matrix='{"include":[{"runner":"macos-15-intel","arch":"x64","rust_target":"x86_64-apple-darwin","metadata":"latest-x64-mac.yml"}]}'
              ;;
            all)
              package_matrix='{"include":[{"runner":"macos-15-intel","arch":"x64","rust_target":"x86_64-apple-darwin","metadata":"latest-x64-mac.yml"},{"runner":"macos-14","arch":"arm64","rust_target":"aarch64-apple-darwin","metadata":"latest-mac.yml"}]}'
              ;;
            *)
              echo "::error::Unsupported macOS release architecture '$release_arch'."
              exit 1
              ;;
          esac
          {
            echo "should_publish=true"
            echo "tag_name=$tag"
            echo "version=${tag#v}"
            echo "is_stable=$is_stable"
            echo "commit_sha=$commit_sha"
            echo "package_matrix=$package_matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Require macOS signing and notarization credentials
        if: steps.meta.outputs.should_publish == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=()
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required macOS release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Create or reuse macOS release
        if: steps.meta.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          IS_STABLE: ${{ steps.meta.outputs.is_stable }}
        shell: bash
        run: |
          release_channel=(--latest=true)
          if [ "$IS_STABLE" != "true" ]; then
            release_channel=(--prerelease --latest=false)
          fi

          if release_json="$(gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
            expected_prerelease=false
            if [ "$IS_STABLE" != "true" ]; then
              expected_prerelease=true
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "::error::Release $TAG_NAME already exists with an incompatible channel state."
              exit 1
            fi
            if [ "$is_draft" = "true" ]; then
              echo "Reusing the draft release for $TAG_NAME"
            else
              echo "Appending verified assets to the already-public release for $TAG_NAME"
            fi
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              --draft \
              "${release_channel[@]}"
          fi

  package-macos:
    name: Package macOS (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout prepared release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify prepared release commit
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$TAG_NAME^{commit}")"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Prepared macOS release commit changed before packaging."
            exit 1
          fi

      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package signed and notarized macOS installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package.mjs --mac --${{ matrix.arch }} --publish never

      - name: Verify Developer ID signature and notarization
        working-directory: apps/desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'Patchbay.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::Packaged Patchbay.app was not found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -Fq 'Authority=Developer ID Application:' <<< "$signature_details" || {
            echo "::error::Patchbay.app is not signed with a Developer ID Application identity."
            exit 1
          }
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature_details" || {
            echo "::error::Patchbay.app was signed by an unexpected Apple team."
            exit 1
          }

          xcrun stapler validate "$app_path"
          assessment="$(spctl --assess --type execute --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$assessment"
          grep -Fq 'source=Notarized Developer ID' <<< "$assessment" || {
            echo "::error::Gatekeeper did not recognize Patchbay.app as notarized Developer ID software."
            exit 1
          }

      - name: Prepare verified macOS assets
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          required_assets=(
            "dist/patchbay-desktop-$VERSION-mac-${{ matrix.arch }}.dmg"
            "dist/patchbay-desktop-$VERSION-mac-${{ matrix.arch }}.zip"
            "dist/${{ matrix.metadata }}"
          )
          for asset in "${required_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing verified macOS release asset $asset."
              exit 1
            fi
          done

          blockmap="dist/patchbay-desktop-$VERSION-mac-${{ matrix.arch }}.zip.blockmap"
          if [ -f "$blockmap" ]; then
            required_assets+=("$blockmap")
          fi

      - name: Stage verified macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: |
            apps/desktop/dist/patchbay-desktop-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.dmg
            apps/desktop/dist/patchbay-desktop-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.zip
            apps/desktop/dist/patchbay-desktop-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.zip.blockmap
            apps/desktop/dist/${{ matrix.metadata }}
          if-no-files-found: error

  publish:
    needs: [prepare, package-macos]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified macOS assets
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          path: staged-macos-assets
          merge-multiple: true

      - name: Upload verified macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          REQUESTED_ARCH: ${{ github.event_name == 'workflow_run' && 'arm64' || inputs.arch }}
        shell: bash
        run: |
          required_assets=()
          if [ "$REQUESTED_ARCH" = "arm64" ] || [ "$REQUESTED_ARCH" = "all" ]; then
            required_assets+=(
              "patchbay-desktop-$VERSION-mac-arm64.dmg"
              "patchbay-desktop-$VERSION-mac-arm64.zip"
              latest-mac.yml
            )
          fi
          if [ "$REQUESTED_ARCH" = "x64" ] || [ "$REQUESTED_ARCH" = "all" ]; then
            required_assets+=(
              "patchbay-desktop-$VERSION-mac-x64.dmg"
              "patchbay-desktop-$VERSION-mac-x64.zip"
              latest-x64-mac.yml
            )
          fi
          for asset in "${required_assets[@]}"; do
            if [ ! -f "staged-macos-assets/$asset" ]; then
              echo "::error::Staged macOS release is missing required asset $asset."
              exit 1
            fi
          done

          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
          tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          tag_type="$(jq -r '.object.type' <<< "$tag_json")"
          while [ "$tag_type" = "tag" ]; do
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag $TAG_NAME no longer resolves to prepared commit $EXPECTED_COMMIT."
            exit 1
          fi

          shopt -s nullglob
          assets=(staged-macos-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No verified macOS assets were staged."
            exit 1
          fi
          gh release upload "$TAG_NAME" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: |
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
          tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          tag_type="$(jq -r '.object.type' <<< "$tag_json")"
          while [ "$tag_type" = "tag" ]; do
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag $TAG_NAME no longer resolves to prepared commit $EXPECTED_COMMIT."
            exit 1
          fi
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
