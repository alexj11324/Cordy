name: Aspectlylabs production images

on:
  push:
    branches:
      - codex/aspectlylabs-fce7-build
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@v4
        with:
          ref: fce7fead79d71908e2475111940671995c9f1b6b
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-backend:fce7fead
          build-args: |
            VERSION=fce7fead
            COMMIT=fce7fead79d71908e2475111940671995c9f1b6b
            DATE=2026-08-30T14:31:05Z
          cache-from: type=gha,scope=aspectlylabs-backend
          cache-to: type=gha,mode=max,scope=aspectlylabs-backend

  web:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@v4
        with:
          ref: fce7fead79d71908e2475111940671995c9f1b6b
          fetch-depth: 1

      - name: Require the production Clerk publishable key
        env:
          CLERK_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "${CLERK_KEY:-}" || {
            echo "::error::Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-web:fce7fead
          build-args: |
            NEXT_PUBLIC_APP_VERSION=fce7fead
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=aspectlylabs-web
          cache-to: type=gha,mode=max,scope=aspectlylabs-web
