name: Aspectlylabs production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Production is a single mutable target. Never interrupt an in-flight deploy;
# GitHub keeps at most one newer run pending and replaces older pending runs.
concurrency:
  group: aspectlylabs-production
  cancel-in-progress: false

jobs:
  resolve-source:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      date: ${{ steps.source.outputs.date }}
    steps:
      - name: Checkout the CI-approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Require the current main tip
        id: source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "::error::Refusing to publish stale source $source_sha; current main is $main_sha."
            exit 1
          fi
          {
            echo "sha=$source_sha"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Every approved main commit builds the complete production image set. The
  # matrix is parallelism only: there are no path filters or partial choices.
  build-images:
    needs: resolve-source
    name: Build ${{ matrix.name }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            repository: patchbay-backend
          - name: web
            repository: patchbay-web
          - name: docs
            repository: patchbay-docs
          - name: auth-broker
            repository: patchbay-auth-broker
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Production builds the current Go server directly from Dockerfile.
      # BuildKit's Go module cache is an optimization only; the immutable
      # image digest and source labels are the deployment authority.

      - name: Build and publish backend
        if: ${{ matrix.name == 'backend' }}
        id: backend-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-backend:sha-${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT=${{ needs.resolve-source.outputs.sha }}
            DATE=${{ needs.resolve-source.outputs.date }}
          cache-from: type=gha,scope=production-backend-linux-arm64
          cache-to: type=gha,mode=max,scope=production-backend-linux-arm64
          provenance: mode=max
          sbom: true

      - name: Build and publish Web
        if: ${{ matrix.name == 'web' }}
        id: web-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-web:sha-${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT_SHA=${{ needs.resolve-source.outputs.sha }}
            NEXT_PUBLIC_DESKTOP_APP_ORIGIN=${{ vars.NEXT_PUBLIC_DESKTOP_APP_ORIGIN }}
          cache-from: type=gha,scope=production-web-linux-arm64
          cache-to: type=gha,mode=max,scope=production-web-linux-arm64
          provenance: mode=max
          sbom: true

      - name: Build and publish Docs
        if: ${{ matrix.name == 'docs' }}
        id: docs-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.docs
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-docs:sha-${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT_SHA=${{ needs.resolve-source.outputs.sha }}
          cache-from: type=gha,scope=production-docs-linux-arm64
          cache-to: type=gha,mode=max,scope=production-docs-linux-arm64
          provenance: mode=max
          sbom: true

      - name: Build and publish Auth Broker
        if: ${{ matrix.name == 'auth-broker' }}
        id: auth-broker-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.auth-broker
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker:sha-${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=sha-${{ needs.resolve-source.outputs.sha }}
            COMMIT_SHA=${{ needs.resolve-source.outputs.sha }}
          cache-from: type=gha,scope=production-auth-broker-linux-arm64
          cache-to: type=gha,mode=max,scope=production-auth-broker-linux-arm64
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          IMAGE_DIGEST: ${{ steps.backend-build.outputs.digest || steps.web-build.outputs.digest || steps.docs-build.outputs.digest || steps.auth-broker-build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid $IMAGE_NAME digest: $IMAGE_DIGEST"
            exit 1
          fi
          mkdir -p /tmp/production-image
          jq -n \
            --arg name "$IMAGE_NAME" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$IMAGE_DIGEST" \
            --arg source_sha "$SOURCE_SHA" \
            '{schema_version: 1, name: $name, repository: $repository, digest: $digest, source_sha: $source_sha, ref: ($repository + "@" + $digest)}' \
            > "/tmp/production-image/$IMAGE_NAME.json"

      - name: Upload immutable image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-${{ matrix.name }}
          path: /tmp/production-image/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  verify-image-set:
    needs: [resolve-source, build-images]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.resolve-source.outputs.sha }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Download the complete image set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/production-images
          pattern: production-image-*
          merge-multiple: true

      - name: Assemble deployment manifest
        run: |
          set -Eeuo pipefail
          node scripts/assemble-production-manifest.mjs \
            /tmp/production-images \
            ${{ needs.resolve-source.outputs.sha }} \
            /tmp/production-manifest.json \
            ${{ github.repository_owner }}
          (
            cd /tmp
            sha256sum production-manifest.json > production-manifest.json.sha256
          )

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify every immutable image is pullable
        run: |
          set -Eeuo pipefail
          jq -r '.images[]' /tmp/production-manifest.json | while IFS= read -r image; do
            docker buildx imagetools inspect "$image" >/dev/null
          done

      - name: Upload deployment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-manifest-${{ needs.resolve-source.outputs.sha }}
          path: |
            /tmp/production-manifest.json
            /tmp/production-manifest.json.sha256
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: [resolve-source, verify-image-set]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://patchbay.aspectlylabs.com
    steps:
      - name: Checkout deployment verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install browser acceptance dependencies
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm exec playwright install --with-deps chromium

      - name: Download deployment manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-manifest-${{ needs.resolve-source.outputs.sha }}
          path: /tmp/production

      - name: Configure restricted production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production environment secret: $name"
              exit 1
            fi
          done
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/production_ed25519"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/production_ed25519"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Verify deployment manifest checksum
        run: |
          set -Eeuo pipefail
          cd /tmp/production
          sha256sum --check production-manifest.json.sha256

      - name: Deploy, verify public routes, and roll back on failure
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [ -z "${CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi
          ssh_args=(
            -i "$HOME/.ssh/production_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            "$DEPLOY_USER@$DEPLOY_HOST"
          )
          deployment_attempted=false
          rollback() {
            status=$?
            if [ "$deployment_attempted" = "true" ]; then
              jq -n \
                --arg source_sha "$SOURCE_SHA" \
                --arg workflow_run_id "$deployment_run_id" \
                '{schema_version: 2, action: "rollback", failed_source_sha: $source_sha, failed_workflow_run_id: $workflow_run_id}' |
                ssh "${ssh_args[@]}" || true
            fi
            exit "$status"
          }
          trap rollback ERR

          deployment_run_id="$(
            jq -er \
              '.workflow_run_id | select(test("^[1-9][0-9]{0,19}$"))' \
              /tmp/production/production-manifest.json
          )"

          # Treat a lost SSH response as an ambiguous deployment, not as proof
          # that the server stayed untouched. The rollback protocol is
          # idempotent and no-ops unless this exact run changed the current SHA.
          deployment_attempted=true
          ssh "${ssh_args[@]}" \
            < /tmp/production/production-manifest.json \
            > /tmp/production/deployment-receipt.json
          if jq -e \
            --arg source_sha "$SOURCE_SHA" \
            '.ok == true and .action == "deploy" and .source_sha == $source_sha
              and .unchanged == true' \
            /tmp/production/deployment-receipt.json >/dev/null; then
            deployment_attempted=false
          fi
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg workflow_run_id "$deployment_run_id" \
            '.ok == true and .action == "deploy" and .source_sha == $source_sha
              and .workflow_run_id == $workflow_run_id
              and ((.browser_auth.sign_in_ticket | type) == "string")
              and ((.browser_auth.sign_in_ticket | length) > 0)
              and ((.browser_auth.testing_token | type) == "string")
              and ((.browser_auth.testing_token | length) > 0)' \
            /tmp/production/deployment-receipt.json >/dev/null
          while IFS= read -r credential; do
            echo "::add-mask::$credential"
          done < <(
            jq -r \
              '.browser_auth.sign_in_ticket, .browser_auth.testing_token' \
              /tmp/production/deployment-receipt.json
          )

          node scripts/verify-production-deployment.mjs "$SOURCE_SHA"
          node scripts/verify-production-browser.mjs \
            "$SOURCE_SHA" \
            /tmp/production/deployment-receipt.json
          trap - ERR

          {
            echo "### Production deployment"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Complete image set: backend, web, docs, auth-broker"
            echo "- Runtime, Google OAuth start, app-entry, and authenticated browser verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser failure screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-browser-failure-${{ needs.resolve-source.outputs.sha }}
          path: ${{ runner.temp }}/production-browser-failure.png
          if-no-files-found: ignore
          retention-days: 1
