name: Aspectlylabs production images

on:
  push:
    branches:
      - codex/aspectlylabs-fce7-build
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve immutable source metadata
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          {
            echo "sha=${source_sha}"
            echo "tag=${source_sha:0:8}"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-backend:${{ steps.source.outputs.tag }}
          build-args: |
            VERSION=${{ steps.source.outputs.tag }}
            COMMIT=${{ steps.source.outputs.sha }}
            DATE=${{ steps.source.outputs.date }}
          cache-from: type=gha,scope=aspectlylabs-backend
          cache-to: type=gha,mode=max,scope=aspectlylabs-backend

  web:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve immutable source metadata
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          {
            echo "sha=${source_sha}"
            echo "tag=${source_sha:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: Require the production Clerk publishable key
        env:
          CLERK_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "${CLERK_KEY:-}" || {
            echo "::error::Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-web:${{ steps.source.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.source.outputs.tag }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=aspectlylabs-web
          cache-to: type=gha,mode=max,scope=aspectlylabs-web

  docs:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve immutable source metadata
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "tag=${source_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docs
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.docs
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchbay-docs:${{ steps.source.outputs.tag }}
          cache-from: type=gha,scope=aspectlylabs-docs
          cache-to: type=gha,mode=max,scope=aspectlylabs-docs
