name: CI

on:
  push:
    branches: [main]
    # Version-tag pushes must pass the same CI gate before the automatic
    # macOS ARM64 release workflow is allowed to run.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used for path and image-budget comparisons
        required: true
        default: main
        type: string
      pr_body:
        description: Optional PR body, used only for an oversized-image exemption
        required: false
        type: string
      run_rust:
        description: Run the Rust validation suite
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the frontend and installer validation jobs have anything
  # to do. Rust is deliberately excluded from automatic path classification:
  # it runs only when a maintainer explicitly selects run_rust in a manual run.
  # The frontend jobs validate the web/desktop apps, the shared packages,
  # the install graph, and the selfhost / reserved-slugs scripts it runs;
  # a pure backend-only or docs-only PR touches none of those and gains
  # nothing from a full web build. The outputs are consumed by the focused
  # jobs below.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      rust: ${{ steps.decide.outputs.rust }}
      installer: ${{ steps.decide.outputs.installer }}
      images: ${{ steps.filter.outputs.images }}
      auth_broker_release: ${{ steps.auth-impact.outputs.auth_broker_release }}
      full_google_oauth_e2e: ${{ steps.auth-impact.outputs.full_google_oauth_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject legacy product markers
        run: bash scripts/check-legacy-brand-markers.sh

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ inputs.base_ref || github.base_ref || 'main' }}
          # apps/docs is excluded from the frontend turbo run, but knip does
          # analyze it, so a docs-only change still needs this job.
          # apps/mobile has its own mobile-verify workflow. Everything else
          # the frontend job touches is listed here; bias toward
          # over-matching since a missed path silently skips validation.
          filters: |
            frontend:
              - 'apps/auth-broker/**'
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'apps/docs/**'
              - 'packages/**'
              - 'package.json'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'knip.jsonc'
              - 'Dockerfile.web'
              - 'Dockerfile.auth-broker'
              - 'contracts/auth-broker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/container-images.yml'
              - '.github/workflows/auth-broker-release.yml'
              - '.github/workflows/release.yml'
              - 'scripts/generate-reserved-slugs.mjs'
              - 'scripts/classify-auth-change.mjs'
              - 'scripts/classify-auth-change.test.mjs'
              - 'server-rs/crates/patchbay-handler/assets/reserved_slugs.json'
              - 'scripts/check-ui-wildcard-exports.mjs'
              - 'scripts/check-ui-wildcard-exports.test.sh'
              - 'scripts/selfhost-config.test.sh'
              - 'scripts/drop-database.sh'
              - 'scripts/ensure-dev-integration-secrets.mjs'
              - 'scripts/postgres-runtime.sh'
              - 'scripts/postgres-runtime.test.sh'
              - 'scripts/remove-worktree.sh'
              - 'scripts/run-rust.sh'
              - 'scripts/worktree-db.test.sh'
              - 'scripts/selfhost-wait.sh'
              # selfhost-config.test.sh asserts on the installers' side of
              # the port contract, so a change to either must run it.
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
              - 'scripts/check.sh'
              - 'scripts/dev.sh'
              - 'scripts/dev.ps1'
              - 'scripts/dev.ps1.test.ps1'
              - 'scripts/dev-launcher.mjs'
              - 'scripts/local-env.sh'
              - '.env.example'
              - 'docker-compose.selfhost.yml'
              - 'docker-compose.selfhost.build.yml'
              - 'docker-compose.labs.yml'
              - 'Makefile'
            installer:
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
              - 'scripts/install.test.sh'
              - 'scripts/install.ps1.test.ps1'
              - 'scripts/dev.ps1'
              - 'scripts/dev.ps1.test.ps1'
              - 'scripts/dev-launcher.mjs'
              - 'docker/entrypoint.sh'
              - 'docker-compose.selfhost.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'
            # Gates the image-budget job so the full-history checkout it
            # needs is only paid for on PRs that actually touch a bitmap.
            images:
              - '**/*.png'
              - '**/*.jpg'
              - '**/*.jpeg'
              - '**/*.gif'
              - '**/*.bmp'
              - '**/*.tif'
              - '**/*.tiff'
              - '**/*.webp'
              - '**/*.avif'
              - 'scripts/check-image-budget.mjs'

      - name: Classify authentication release impact
        id: auth-impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            node scripts/classify-auth-change.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            echo "auth_broker_release=false" >> "$GITHUB_OUTPUT"
            echo "full_google_oauth_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize authentication release impact
        env:
          AUTH_BROKER_RELEASE: ${{ steps.auth-impact.outputs.auth_broker_release }}
          FULL_GOOGLE_OAUTH_E2E: ${{ steps.auth-impact.outputs.full_google_oauth_e2e }}
        run: |
          {
            echo "### Authentication release impact"
            echo "- Independent broker release: \`$AUTH_BROKER_RELEASE\`"
            echo "- Full Google OAuth E2E before auth traffic cutover: \`$FULL_GOOGLE_OAUTH_E2E\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide
        id: decide
        # Frontend and installer workers run automatically for relevant PRs
        # and for pushes. Rust workers are independent of paths and can be
        # enabled only by explicitly selecting run_rust in workflow_dispatch.
        # The stable frontend/backend aggregate checks distinguish intentional
        # path/manual skips from a failed classifier or missing worker.
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          INSTALLER_CHANGED: ${{ steps.filter.outputs.installer }}
          RUN_RUST: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rust == true }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$FRONTEND_CHANGED" = "true" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RUN_RUST" = "true" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$INSTALLER_CHANGED" = "true" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  # The frontend validation is split across four runners on purpose. A prior
  # split isolated build/typecheck/lint from the test suites; on a full test
  # cache miss, however, web/core/desktop/views still competed for the four
  # vCPUs on the test runner and stretched the job to ~8 minutes. Giving views
  # its own runner only reduced that to 7m23s because the suite itself remained
  # the long pole, so two Vitest shards now split it across two runners while
  # the remaining suites continue in parallel on another. The extra setup
  # increases total runner-minutes but reduces wall-clock feedback time.
  frontend-build:
    needs: changes
    runs-on: ubuntu-latest
    env:
      # Pin turbo's filesystem cache somewhere actions/cache can address.
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.auth_broker_release == 'true' }}
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm install

      # `node-version: 22` above floats across patch releases, and turbo's
      # global hash does not include the interpreter at all (`engines` is null
      # in its dry-run cache inputs). Without the resolved version in the key,
      # a runner silently moving to another 22.x would restore a cache built by
      # the old interpreter and report green without executing anything.
      - name: Resolve runtime for cache key
        id: runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so the key carries the commit SHA to make
      # every run publish a fresh one and `restore-keys` falls back to the most
      # recent prefix match. Each frontend worker runs a disjoint task set, so
      # it gets its own prefix rather than racing to save one key.
      # GitHub scopes caches by branch: a PR reads main's entries (so unchanged
      # tasks hit on the first push) and writes its own (so re-pushes hit too).
      - name: Restore turbo cache
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-

      - name: Test self-host env derivation
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: bash scripts/selfhost-config.test.sh

      - name: Test worktree database cleanup
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: bash scripts/worktree-db.test.sh

      - name: Test native PostgreSQL development runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: bash scripts/postgres-runtime.test.sh

      - name: Test authentication release classification
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: node --test scripts/classify-auth-change.test.mjs

      - name: Verify reserved-slugs.ts is up to date
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        # Re-runs the generator and fails on any drift from the
        # checked-in TypeScript output. The Rust handler embeds the JSON
        # source directly, so a passing diff here proves both sides
        # share one source of truth.
        run: |
          pnpm generate:reserved-slugs
          git diff --exit-code -- packages/core/paths/reserved-slugs.ts

      - name: Build, type check, and lint
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        # Mobile lives in a parallel mobile-verify workflow (path-filtered
        # to apps/mobile/** + packages/core/**) so it doesn't add
        # ~50s of expo-lint + tsc to every web/desktop PR. Keep this
        # filter in sync with the root package.json scripts, which also
        # exclude @patchbay/mobile.
        # @patchbay/web's build and typecheck both generate the same Fumadocs
        # `.source` tree. Turbo may otherwise run them concurrently and one
        # generator can remove the directory while the other is traversing it.
        # Keep lint parallel with typecheck, but finish builds first.
        run: |
          pnpm exec turbo build --filter='!@patchbay/docs' --filter='!@patchbay/mobile'
          pnpm exec turbo typecheck lint --filter='!@patchbay/docs' --filter='!@patchbay/mobile'

      - name: Setup Docker Buildx for auth broker
        if: ${{ needs.changes.outputs.auth_broker_release == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build independent auth broker image
        if: ${{ needs.changes.outputs.auth_broker_release == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auth-broker
          push: false
          tags: patchbay-auth-broker:ci
          cache-from: type=gha,scope=ci-auth-broker
          cache-to: type=gha,mode=max,scope=ci-auth-broker

      # Blocking from the start: it reports nothing today, and it covers the
      # one regression knip structurally cannot see. packages/ui exports four
      # wildcards, which knip expands into entry-point globs over every file
      # in those directories — so a newly stranded component there always
      # reads as "used". See the script header for the options ruled out.
      - name: Check packages/ui wildcard exports
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: |
          bash scripts/check-ui-wildcard-exports.test.sh
          node scripts/check-ui-wildcard-exports.mjs

      # WARN PHASE — reports, never blocks. `shamefully-hoist=true` in .npmrc
      # hides both halves of the drift this catches: an undeclared import still
      # resolves, and an obsolete declaration still installs. Neither shows up
      # in build, typecheck, or lint.
      #
      # `continue-on-error` alone, with no `|| true`: the real exit code has to
      # reach Actions for the step to show as a warning rather than a silent
      # pass, and it is what makes the promotion below a one-line change.
      #
      # TO PROMOTE TO BLOCKING: once this step has run clean for a full cycle
      # on main, drop `continue-on-error`. The findings it reports today are
      # pre-existing dead code left out of the cleanup that introduced it
      # (PB-6353) — clear those first, or the flip turns them into a red main.
      - name: Check for dead code and phantom dependencies (knip)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        continue-on-error: true
        run: pnpm knip

  frontend-test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm install

      - name: Resolve runtime for cache key
        id: runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # See frontend-build for the key strategy. These entries are tiny (~60KB
      # measured): `test` declares no outputs, so turbo caches exit codes and
      # logs rather than artifacts -- yet a hit still skips the whole suite,
      # which is the single most expensive task in the graph.
      - name: Restore turbo cache
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-

      - name: Test web, core, and desktop
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        # Same filter rationale as frontend-build. Type errors are not this
        # job's responsibility -- frontend-build owns the `typecheck` task.
        # `test` reaches dependency sources through the hash-only
        # `^cache-inputs` edge (see turbo.json), so no `tsc` runs here.
        run: pnpm exec turbo test --filter='!@patchbay/docs' --filter='!@patchbay/mobile' --filter='!@patchbay/views'

  # Split views across two runners. GitHub reports the matrix job's combined
  # result, so the aggregate gate can continue depending on this one job ID.
  frontend-views-test:
    name: frontend-views-test (${{ matrix.index }}/${{ matrix.total }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            total: 2
          - index: 2
            total: 2
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm install

      - name: Resolve runtime for cache key
        id: runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Each shard has its own prefix so concurrent jobs never race to save the
      # same immutable cache key. Turbo also includes the passthrough `--shard`
      # argument in the task hash, while dependency sources still flow through
      # turbo.json's hash-only `^cache-inputs` edge.
      - name: Restore turbo cache
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-views-test-${{ matrix.index }}-of-${{ matrix.total }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-views-test-${{ matrix.index }}-of-${{ matrix.total }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-

      - name: Test views shard ${{ matrix.index }}/${{ matrix.total }}
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm exec turbo test --filter='@patchbay/views' -- --shard=${{ matrix.index }}/${{ matrix.total }}

  # Aggregate gate. `frontend` is the status-check name the repository's
  # branch rules refer to, so it has to survive the split above: this job
  # keeps reporting under that name and simply fails when any worker fails.
  # It also inherits the old contract that the check goes green (rather than
  # staying pending) on PRs the path filter excluded — all workers succeed
  # trivially in that case because every step is gated off.
  frontend:
    needs: [frontend-build, frontend-test, frontend-views-test]
    # `!cancelled()` rather than `always()`: a run superseded by a newer push
    # is cancelled by the concurrency group above, and there is no reason to
    # spend a runner reporting a verdict nobody will read.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend job results
        env:
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          TEST_RESULT: ${{ needs.frontend-test.result }}
          VIEWS_TEST_RESULT: ${{ needs.frontend-views-test.result }}
        run: |
          echo "frontend-build: $BUILD_RESULT"
          echo "frontend-test:  $TEST_RESULT"
          echo "frontend-views-test: $VIEWS_TEST_RESULT"
          if [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$VIEWS_TEST_RESULT" != "success" ]; then
            echo "::error::frontend validation failed"
            exit 1
          fi

  rust-deployment-contracts:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Test Rust build and deployment contracts
        run: |
          bash scripts/auth-broker-helm.test.sh
          bash scripts/helm-config.test.sh
          bash scripts/makefile-build.test.sh
          bash scripts/macos-release-contract.test.sh
          bash scripts/verify-release-tag.test.sh

  rust-quality:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        run: rustup default stable

      - name: Restore Cargo registry and git downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Enable bounded shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Check formatting
        working-directory: server-rs
        run: cargo fmt --all --check

      - name: Check every workspace target
        working-directory: server-rs
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        working-directory: server-rs
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace binaries
        working-directory: server-rs
        run: cargo build --workspace --locked

      - name: Report compiler cache effectiveness
        if: always()
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  rust-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # The workspace suite normally completes in about ten minutes. Keep a
    # bounded upper limit so a single hung test cannot hold the merge gate
    # indefinitely while leaving enough room for a cold runner/cache.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: patchbay
          POSTGRES_USER: patchbay
          POSTGRES_PASSWORD: patchbay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchbay -d patchbay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://patchbay:patchbay@localhost:5432/patchbay?sslmode=disable
      SQLX_OFFLINE: "false"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Restore Cargo registry and git downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Enable bounded shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Apply database migrations with the Rust runner
        working-directory: server-rs
        run: cargo run --locked -p patchbay-migrate --bin patchbay-migrate -- up

      - name: Run workspace tests by package
        working-directory: server-rs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t workspace_packages < <(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '
                . as $metadata
                | $metadata.packages[]
                | select(.id as $id | $metadata.workspace_members | index($id))
                | .name
              '
          )

          if ((${#workspace_packages[@]} == 0)); then
            echo "::error::cargo metadata returned no workspace packages"
            exit 1
          fi

          for package in "${workspace_packages[@]}"; do
            echo "::group::cargo test -p ${package}"
            echo "Running workspace package: ${package}"
            cargo test --locked -p "${package}" --all-targets
            echo "::endgroup::"
          done

      - name: Report compiler cache effectiveness
        if: always()
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  rust-audit:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server-rs
          # SQLx 0.8 locks its optional MySQL driver for all-target resolution;
          # the compiled Patchbay graph enables Postgres only. CloudFront signing
          # no longer uses rsa and is implemented with ring/SHA-256.
          ignore: RUSTSEC-2023-0071

  # Preserve the required check name while the Rust checks stay split by
  # concern so a failure points at the actual production boundary.
  backend:
    needs:
      [
        changes,
        rust-deployment-contracts,
        rust-quality,
        rust-tests,
        rust-platform,
        rust-audit,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Rust backend job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_RUST: ${{ needs.changes.outputs.rust }}
          DEPLOYMENT_RESULT: ${{ needs.rust-deployment-contracts.result }}
          QUALITY_RESULT: ${{ needs.rust-quality.result }}
          TEST_RESULT: ${{ needs.rust-tests.result }}
          PLATFORM_RESULT: ${{ needs.rust-platform.result }}
          AUDIT_RESULT: ${{ needs.rust-audit.result }}
        run: |
          echo "changes:       $CHANGES_RESULT"
          echo "run Rust:      $RUN_RUST"
          echo "rust-deploy:   $DEPLOYMENT_RESULT"
          echo "rust-quality:  $QUALITY_RESULT"
          echo "rust-tests:    $TEST_RESULT"
          echo "rust-platform: $PLATFORM_RESULT"
          echo "rust-audit:    $AUDIT_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change classification failed"
            exit 1
          fi
          if [ "$RUN_RUST" != "true" ]; then
            echo "Rust validation was not manually requested."
            exit 0
          fi
          if [ "$DEPLOYMENT_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$PLATFORM_RESULT" != "success" ] || [ "$AUDIT_RESULT" != "success" ]; then
            echo "::error::backend validation failed"
            exit 1
          fi

  rust-platform:
    name: rust-platform (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Restore Cargo registry and git downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Enable bounded shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Test native daemon behavior
        working-directory: server-rs
        run: cargo test -p patchbay-daemon --all-targets --locked

      - name: Report compiler cache effectiveness
        if: always()
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  image-budget:
    # A bitmap added or grown past 300KB fails until the PR description says
    # why. Manual runs compare the selected branch against base_ref;
    # maintainers can paste the PR body when an explicit exemption is needed.
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The check diffs against the base branch, which a shallow
          # clone does not contain.
          fetch-depth: 0

      - name: Check image budget
        env:
          PR_BODY: ${{ inputs.pr_body || github.event.pull_request.body }}
        run: node scripts/check-image-budget.mjs --base "origin/${{ inputs.base_ref || github.base_ref || 'main' }}"

  installer:
    # Stub-driven shell tests for scripts/install.sh and scripts/install.ps1.
    # Kept off the heavy backend job so installer regressions surface
    # independently, and exercised on macOS too because the installer targets
    # macOS/Homebrew and `tar` / `sed` / `mktemp` differ between BSD and GNU
    # userlands. Windows runs the PowerShell installer's own suite: the two
    # installers share one port contract, and neither is covered by the
    # frontend job.
    needs: changes
    if: ${{ needs.changes.outputs.installer == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test shell installers
        if: runner.os != 'Windows'
        run: bash scripts/install.test.sh

      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1.test.ps1
          ./scripts/dev.ps1.test.ps1
