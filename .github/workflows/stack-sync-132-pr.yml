name: Merge reviewed channel fixes into integration

on:
  pull_request:
    branches:
      - codex/cord-14-s8-integrations

permissions:
  contents: write

jobs:
  merge-fix-stack:
    if: github.head_ref == 'automation/stack-sync-132'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/stack-sync-132
          fetch-depth: 0

      - name: Merge fix branches and validate
        shell: bash
        run: |
          set +e
          bash -euxo pipefail <<'SCRIPT' 2>&1 | tee /tmp/stack-merge.log
          target=codex/cord-14-s8-integrations
          branches=(
            codex/cord-19-lark-install-errors
            codex/cord-20-dingtalk-list-capability
            codex/cord-21-channel-lease-config
            codex/cord-22-lark-install-projection
            codex/cord-23-wecom-install-errors
            codex/cord-24-telegram-install-verdicts
            codex/cord-25-slack-install-ownership
            codex/cord-26-telegram-install-ownership
            codex/cord-27-telegram-install-timeout
            codex/cord-28-channel-file-delivery
            codex/cord-29-channel-init-isolation
            codex/cord-32-slack-socket-ack
            codex/cord-33-slack-disconnect
            codex/cord-34-slack-write-timeout
            codex/cord-35-slack-handshake-timeout
            codex/cord-36-channel-install-pool-release
            codex/cord-37-dingtalk-media-lifecycle
            codex/cord-39-wecom-read-cancellation
            codex/cord-45-dingtalk-text-frames
          )

          git fetch origin "refs/heads/$target:refs/remotes/origin/$target"
          for branch in "${branches[@]}"; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          done
          expected=$(git rev-parse "origin/$target")
          git switch --detach "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          : > /tmp/merge-conflicts.txt
          for branch in "${branches[@]}"; do
            head=$(git rev-parse "origin/$branch")
            if git merge-base --is-ancestor "$head" HEAD; then
              echo "already included: $branch $head"
              continue
            fi
            echo "merging $branch $head"
            if ! git merge --no-ff --no-edit -X ours "origin/$branch"; then
              echo "conflict: $branch" | tee -a /tmp/merge-conflicts.txt
              git diff --name-only --diff-filter=U | tee -a /tmp/merge-conflicts.txt
              git checkout --ours -- .
              git add -A
              git commit --no-edit
            fi
          done

          git diff --check HEAD~1..HEAD
          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo check \
            --manifest-path server-rs/Cargo.toml --locked \
            -p cordy-handler -p cordy-server \
            -p cordy-lark -p cordy-wecom -p cordy-telegram \
            -p cordy-dingtalk -p cordy-slack

          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo test \
            --manifest-path server-rs/Cargo.toml --locked \
            -p cordy-lark -p cordy-wecom -p cordy-telegram \
            -p cordy-dingtalk -p cordy-slack

          echo 'Conflict resolutions retained cumulative integration versions:'
          cat /tmp/merge-conflicts.txt
          git push --force-with-lease="refs/heads/$target:$expected" origin "HEAD:refs/heads/$target"
          SCRIPT
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/stack-merge.rc
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-merge-diagnostics
          path: |
            /tmp/stack-merge.log
            /tmp/stack-merge.rc
            /tmp/merge-conflicts.txt

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          rc=$(cat /tmp/stack-merge.rc 2>/dev/null || echo 99)
          test "$rc" = 0
