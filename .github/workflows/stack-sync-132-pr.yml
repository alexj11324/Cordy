name: Fix PR 87 exact head

on:
  pull_request:
    branches:
      - codex/cord-14-s8-integrations

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'automation/stack-sync-132'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/stack-sync-132
          fetch-depth: 0

      - name: Stage reviewed patch script
        shell: bash
        run: cp .github/scripts/fix_pr87.py /tmp/fix_pr87.py

      - name: Apply fixes, verify, and update integration
        shell: bash
        run: |
          set +e
          bash -euxo pipefail <<'SCRIPT' 2>&1 | tee /tmp/pr87-fix.log
          target=codex/cord-14-s8-integrations
          git fetch origin "refs/heads/$target:refs/remotes/origin/$target" main
          expected=$(git rev-parse "origin/$target")
          git switch --detach "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 /tmp/fix_pr87.py
          rustfmt --edition 2021 \
            server-rs/crates/cordy-server/src/main.rs \
            server-rs/crates/cordy-handler/src/github.rs \
            server-rs/crates/cordy-handler/src/connectors.rs \
            server-rs/crates/cordy-handler/src/onboarding_shim.rs
          git diff --check

          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo check \
            --manifest-path server-rs/Cargo.toml --locked \
            -p cordy-handler -p cordy-server -p cordy-metrics -p cordy-analytics
          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo test \
            --manifest-path server-rs/Cargo.toml --locked \
            -p cordy-handler -p cordy-server --lib
          CARGO_INCREMENTAL=0 SQLX_OFFLINE=true cargo clippy \
            --manifest-path server-rs/Cargo.toml --locked \
            -p cordy-handler -p cordy-server --all-targets --no-deps -- -D warnings

          git add \
            server-rs/crates/cordy-server/src/main.rs \
            server-rs/crates/cordy-handler/src/github.rs \
            server-rs/crates/cordy-handler/src/connectors.rs \
            server-rs/crates/cordy-handler/src/onboarding_shim.rs
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "fix(handler): clear remaining PR 87 blockers"
            git push --force-with-lease="refs/heads/$target:$expected" origin "HEAD:refs/heads/$target"
          fi
          SCRIPT
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/pr87-fix.rc
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr87-fix-diagnostics
          path: |
            /tmp/pr87-fix.log
            /tmp/pr87-fix.rc

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          rc=$(cat /tmp/pr87-fix.rc 2>/dev/null || echo 99)
          test "$rc" = 0
