name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
      commit_sha: ${{ steps.release_meta.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Refusing to release '$tag' because its commit is not contained in main."
            exit 1
          fi
          commit_sha="$(git rev-parse HEAD)"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full verified commit SHA for '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

      - name: Build all Go packages
        working-directory: server
        run: go build ./...

      - name: Scan Go vulnerabilities
        # Fail closed unless an administrator scopes the documented emergency
        # override to this exact tag. See .github/RELEASING.md.
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG != github.ref_name }}
        working-directory: server
        run: go tool govulncheck ./...

      - name: Record emergency vulnerability-scan bypass
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG == github.ref_name }}
        run: echo "::warning::govulncheck was explicitly skipped for ${GITHUB_REF_NAME}; see .github/RELEASING.md"

      - name: Test Desktop release artifact contract
        run: node --test scripts/release-desktop-artifact-contract.test.mjs

      - name: Test Homebrew release contract
        run: node --test scripts/release-homebrew-contract.test.mjs scripts/publish-homebrew-cask.test.mjs

  prepare-release:
    needs: verify
    # Only run on the canonical repository. Forks don't have the
    # Forks must not publish a formula or staged release. Keep this guard
    # aligned with the actual repository; the project is currently hosted at
    # alexj11324/Cordy.
    if: github.repository == 'alexj11324/Cordy'
    runs-on: ubuntu-latest
    steps:
      - name: Create staged draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          test "$tag_sha" = "$VERIFIED_SHA" || {
            echo "::error::Release tag $TAG_NAME no longer targets the verified commit $VERIFIED_SHA (found $tag_sha)."
            exit 1
          }
          if release_json="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
            expected_prerelease=false
            if [ "${{ needs.verify.outputs.is_stable }}" != "true" ]; then
              expected_prerelease=true
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "::error::Release $TAG_NAME already exists with an incompatible channel state."
              exit 1
            fi
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG_NAME is already public; refusing to append an un-gated artifact set."
              exit 1
            fi
            echo "Reusing staged draft release $TAG_NAME"
          else
            channel_args=(--latest=false)
            if [ "${{ needs.verify.outputs.is_stable }}" != "true" ]; then
              channel_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              --draft \
              "${channel_args[@]}"
          fi

  # Multi-arch images are built natively per platform on dedicated runners
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and merged into a
  # manifest list. This avoids QEMU emulation, which was making the Next.js
  # arm64 build run for 30+ minutes per release.
  docker-backend-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-backend
          labels: |
            org.opencontainers.image.title=Patchbay Backend
            org.opencontainers.image.description=Patchbay self-hosted backend
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ needs.verify.outputs.commit_sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/patchbay-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-web
          labels: |
            org.opencontainers.image.title=Patchbay Web
            org.opencontainers.image.description=Patchbay self-hosted web frontend
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/patchbay-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-web:${{ steps.meta.outputs.version }}

  docker-auth-broker-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
      - name: Compute auth broker image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker
          labels: |
            org.opencontainers.image.title=Patchbay Auth Broker
            org.opencontainers.image.description=Patchbay accounts authentication broker
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit_sha }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auth-broker
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-auth-broker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-auth-broker-${{ env.PLATFORM_PAIR }}
          build-args: NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-auth-broker-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-auth-broker-merge:
    needs: [verify, docker-auth-broker-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-auth-broker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-auth-broker-*
          merge-multiple: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute auth broker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge, docker-auth-broker-merge]
    if: github.repository == 'alexj11324/Cordy'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/patchbay
      OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push ".chart-packages/patchbay-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/patchbay" --version "$CHART_VERSION"

  # Build the Desktop installers for Linux, Windows, and macOS. They are
  # uploaded to the staged draft only after every backend, web, and chart gate
  # succeeds.
  desktop:
    needs: [verify, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: all
          - os: windows-latest
            target: win
            arch: all
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Require macOS signing and notarization credentials
        if: matrix.target == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required macOS release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }} ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'mac' && 'true' || 'false' }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            node scripts/package.mjs --mac --${{ matrix.arch }} --publish never
          else
            node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish never
          fi

      - name: Validate macOS signature, notarization, and update assets
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          expected_runner_arch="x86_64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            expected_runner_arch="arm64"
          fi
          test "$(uname -m)" = "$expected_runner_arch" || {
            echo "::error::The macOS ${{ matrix.arch }} release must run on a $expected_runner_arch runner."
            exit 1
          }
          app_path="$(find dist -type d -name '*.app' -print -quit)"
          test -n "$app_path" || {
            echo "::error::electron-builder did not produce a macOS .app bundle."
            exit 1
          }
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable"
          test -x "$executable_path" || {
            echo "::error::macOS bundle executable is missing: $executable_path"
            exit 1
          }
          archs="$(lipo -archs "$executable_path")"
          test "$archs" = "$expected_runner_arch" || {
            echo "::error::Expected a $expected_runner_arch-only executable, found: $archs"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          identity="$(codesign -dv --verbose=4 "$app_path" 2>&1 | sed -n 's/^Authority=//p' | head -n 1)"
          case "$identity" in
            "Developer ID Application:"*) ;;
            *)
              echo "::error::macOS app is not signed with a Developer ID Application identity: ${identity:-unknown}"
              exit 1
              ;;
          esac
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          for extension in dmg zip; do
            test -n "$(find dist -type f -name "*-mac-${{ matrix.arch }}.${extension}" -print -quit)" || {
              echo "::error::The signed macOS ${{ matrix.arch }} ${extension} is missing from the desktop output."
              exit 1
            }
          done
          metadata="latest-mac.yml"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            metadata="latest-x64-mac.yml"
          fi
          test -n "$(find dist -type f -name "$metadata" -print -quit)" || {
            echo "::error::The macOS ${{ matrix.arch }} updater metadata $metadata is missing."
            exit 1
          }

      - name: Stage Desktop artifacts and write manifest
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            copyFileSync,
            mkdirSync,
            readdirSync,
            readFileSync,
            rmSync,
            statSync,
            writeFileSync,
          } from "node:fs";
          import { basename, dirname, join, relative, resolve } from "node:path";

          const target = process.env.TARGET;
          const arch = process.env.ARCH;
          if (!target || !arch) throw new Error("Desktop target and arch are required");
          const dist = resolve("dist");
          const stage = join(process.env.RUNNER_TEMP, `patchbay-desktop-${target}-${arch}`);
          const manifestName = `patchbay-desktop-${target}-${arch}-manifest.json`;
          const assetPattern = /^(?:latest.*\.ya?ml|patchbay-desktop-(?!.*\.__uninstaller\.).+\.(?:7z|AppImage|deb|dmg|exe|rpm|zip|blockmap))$/i;

          rmSync(stage, { recursive: true, force: true });
          mkdirSync(stage, { recursive: true });

          function walk(directory) {
            const entries = readdirSync(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const absolute = join(directory, entry.name);
              if (entry.isDirectory()) files.push(...walk(absolute));
              else if (entry.isFile()) files.push(absolute);
            }
            return files;
          }

          const sourceFiles = walk(dist).filter((file) => assetPattern.test(basename(file)));
          if (sourceFiles.length === 0) throw new Error("No distributable desktop artifacts were produced");

          const names = new Map();
          const files = sourceFiles.map((source) => {
            const name = basename(source);
            const previous = names.get(name);
            if (previous) throw new Error(`Duplicate desktop artifact filename '${name}' from '${previous}' and '${source}'`);
            names.set(name, source);
            const destination = join(stage, name);
            copyFileSync(source, destination);
            const bytes = statSync(destination).size;
            const sha256 = createHash("sha256").update(readFileSync(destination)).digest("hex");
            return { name, source: relative(dist, source).split("\\").join("/"), bytes, sha256 };
          }).sort((left, right) => left.name.localeCompare(right.name));

          const manifest = {
            schemaVersion: 1,
            artifact: `desktop-${target}-${arch}`,
            target,
            arch,
            tag: process.env.TAG_NAME,
            commit: process.env.VERIFIED_SHA,
            files,
          };
          writeFileSync(join(stage, manifestName), `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify({ stage, manifest: manifestName, files: files.length }));
          NODE

      - name: Upload Desktop artifacts for final publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/patchbay-desktop-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [verify, prepare-release, docker-backend-merge, docker-web-merge, docker-auth-broker-merge, helm-chart, desktop]
    if: >-
      always() &&
      github.repository == 'alexj11324/Cordy' &&
      needs.verify.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      needs.docker-backend-merge.result == 'success' &&
      needs.docker-web-merge.result == 'success' &&
      needs.docker-auth-broker-merge.result == 'success' &&
      needs.helm-chart.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup Node 22 for artifact validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download staged Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/desktop-assets
          pattern: desktop-*
          merge-multiple: false

      - name: Validate Desktop artifact manifests
        env:
          DESKTOP_ASSETS_DIR: ${{ runner.temp }}/desktop-assets
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import { basename, dirname, join, relative, resolve } from "node:path";

          const root = resolve(process.env.DESKTOP_ASSETS_DIR);
          const expectedVariants = new Set([
            "linux:all",
            "win:all",
            "mac:x64",
            "mac:arm64",
          ]);

          function walk(directory) {
            const entries = readdirSync(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const absolute = join(directory, entry.name);
              if (entry.isDirectory()) files.push(...walk(absolute));
              else if (entry.isFile()) files.push(absolute);
            }
            return files;
          }

          const manifests = walk(root).filter((file) => /patchbay-desktop-(linux|win|mac)-(all|x64|arm64)-manifest\.json$/.test(basename(file)));
          if (manifests.length !== expectedVariants.size) {
            throw new Error(`Expected ${expectedVariants.size} desktop manifests, found ${manifests.length}`);
          }
          const seenVariants = new Set();
          for (const manifestPath of manifests) {
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (manifest.schemaVersion !== 1) throw new Error(`Unsupported manifest schema: ${manifestPath}`);
            const variant = `${manifest.target}:${manifest.arch}`;
            if (!expectedVariants.has(variant) || seenVariants.has(variant)) {
              throw new Error(`Unexpected or duplicate desktop variant in ${manifestPath}`);
            }
            if (manifest.artifact !== `desktop-${manifest.target}-${manifest.arch}`) {
              throw new Error(`Desktop manifest artifact identity mismatch: ${manifestPath}`);
            }
            if (manifest.tag !== process.env.TAG_NAME || manifest.commit !== process.env.VERIFIED_SHA) {
              throw new Error(`Desktop manifest identity mismatch: ${manifestPath}`);
            }
            if (!Array.isArray(manifest.files) || manifest.files.length === 0) {
              throw new Error(`Desktop manifest has no files: ${manifestPath}`);
            }
            const manifestDirectory = dirname(manifestPath);
            const names = new Set();
            for (const file of manifest.files) {
              if (!file || typeof file.name !== "string" || !/^[^/\\]+$/.test(file.name)) {
                throw new Error(`Invalid artifact filename in ${manifestPath}`);
              }
              if (names.has(file.name)) throw new Error(`Duplicate artifact in ${manifestPath}: ${file.name}`);
              names.add(file.name);
              const artifactPath = join(manifestDirectory, file.name);
              if (!statSync(artifactPath).isFile()) throw new Error(`Missing artifact for ${manifestPath}: ${file.name}`);
              const bytes = statSync(artifactPath).size;
              const sha256 = createHash("sha256").update(readFileSync(artifactPath)).digest("hex");
              if (bytes !== file.bytes || sha256 !== file.sha256) {
                throw new Error(`Artifact checksum/size mismatch: ${relative(root, artifactPath)}`);
              }
            }
            seenVariants.add(variant);
          }
          for (const expected of expectedVariants) {
            if (!seenVariants.has(expected)) {
              throw new Error(`Missing desktop artifact variant: ${expected}`);
            }
          }
          console.log(`Validated ${manifests.length} desktop artifact manifests for ${process.env.TAG_NAME} at ${process.env.VERIFIED_SHA}`);
          NODE

      - name: Upload Desktop artifacts to staged release
        env:
          DESKTOP_ASSETS_DIR: ${{ runner.temp }}/desktop-assets
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          test "$tag_sha" = "$VERIFIED_SHA" || {
            echo "::error::Release tag $TAG_NAME moved after verification."
            exit 1
          }
          while IFS= read -r -d '' asset; do
            gh release upload "$TAG_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done < <(find "$DESKTOP_ASSETS_DIR" -type f -print0)

      - name: Publish Go CLI and Homebrew artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # Keep GoReleaser in the already-created draft. The final step
          # promotes it only after every desktop, image, chart, and CLI asset
          # has succeeded.
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage stable Homebrew cask
        if: needs.verify.outputs.is_stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/patchbay.rb
          if-no-files-found: error

      - name: Verify staged release is still a draft at the verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          test "$tag_sha" = "$VERIFIED_SHA" || {
            echo "::error::Release tag $TAG_NAME moved before promotion."
            exit 1
          }

      - name: Promote the fully gated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-homebrew:
    needs: [verify, publish-release]
    # The stable cask is a release channel, not a prerelease channel. Keep it
    # unchanged for tags such as v1.0.0-rc1.
    if: needs.verify.outputs.is_stable == 'true' && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download generated Homebrew cask
        uses: actions/download-artifact@v4
        with:
          name: homebrew-cask
          path: ${{ runner.temp }}/homebrew-cask

      - name: Verify release is public at the gated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          VERIFIED_SHA: ${{ needs.verify.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          test "$tag_sha" = "$VERIFIED_SHA" || {
            echo "::error::Release tag $TAG_NAME moved before Homebrew publication."
            exit 1
          }

      - name: Publish stable Homebrew cask
        env:
          CASK_PATH: ${{ runner.temp }}/homebrew-cask/patchbay.rb
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        shell: bash
        run: node scripts/publish-homebrew-cask.mjs
