name: Release

on:
  # Non-macOS-ARM publication is intentionally manual. The automatic
  # macOS ARM64 path is owned by macos-release.yml and starts only after CI
  # succeeds for a version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish self-hosted artifacts for (for example, v0.2.1)
        required: true
        type: string
      promote_latest:
        description: Also promote the backend and web images to the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  checks: write

jobs:
  macos-release-preflight:
    # A production release is incomplete without trusted macOS installers.
    # Fail before a draft Release is created unless every signing/notarization
    # credential is present in the canonical repository's Actions secrets.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require macOS signing and notarization credentials
        shell: bash
        run: |
          missing=()
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required macOS release secret: %s\n' "${missing[@]}"
            exit 1
          fi

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: patchbay
          POSTGRES_USER: patchbay
          POSTGRES_PASSWORD: patchbay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchbay -d patchbay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://patchbay:patchbay@localhost:5432/patchbay?sslmode=disable
      SQLX_OFFLINE: "false"
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      commit_sha: ${{ steps.release_meta.outputs.commit_sha }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target

      - name: Apply database migrations with the Rust runner
        working-directory: server-rs
        run: cargo run --locked -p patchbay-migrate --bin patchbay-migrate -- up

      - name: Run Rust workspace tests
        working-directory: server-rs
        run: cargo test --workspace --all-targets --locked

      - name: Build production Rust binaries
        working-directory: server-rs
        env:
          PATCHBAY_BUILD_VERSION: ${{ steps.release_meta.outputs.tag_name }}
          PATCHBAY_BUILD_COMMIT: ${{ steps.release_meta.outputs.commit_sha }}
        run: |
          PATCHBAY_BUILD_DATE="$(git show -s --format=%cI "$PATCHBAY_BUILD_COMMIT")"
          export PATCHBAY_BUILD_DATE
          cargo build --release --locked -p patchbay-server -p patchbay-cli -p patchbay-migrate --bins

      - name: Scan Rust dependencies
        # Fail closed unless an administrator scopes the documented emergency
        # override to this exact tag. See .github/RELEASING.md.
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG != steps.release_meta.outputs.tag_name }}
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server-rs
          # SQLx 0.8 locks its optional MySQL driver for all-target resolution;
          # the compiled Patchbay graph enables Postgres only. CloudFront signing
          # no longer uses rsa and is implemented with ring/SHA-256.
          ignore: RUSTSEC-2023-0071

      - name: Record emergency vulnerability-scan bypass
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG == steps.release_meta.outputs.tag_name }}
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: echo "::warning::RustSec audit was explicitly skipped for ${TAG_NAME}; see .github/RELEASING.md"

  self-hosted-prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      is_stable: ${{ steps.meta.outputs.is_stable }}
    steps:
      - name: Checkout requested version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Require Clerk publishable key for web image
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Missing required web release secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Validate self-hosted release tag
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Self-hosted release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$REQUESTED_TAG'."
            exit 1
          fi
          if [[ "$REQUESTED_TAG" == *-dirty* ]]; then
            echo "::error::Refusing to publish self-hosted artifacts for dirty tag '$REQUESTED_TAG'."
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$REQUESTED_TAG^{commit}")"
          if [ "$tag_commit" != "$commit_sha" ]; then
            echo "::error::Checked out commit '$commit_sha' does not match requested tag '$REQUESTED_TAG' ($tag_commit)."
            exit 1
          fi

          is_stable=true
          if [[ "$REQUESTED_TAG" == *-* ]]; then
            is_stable=false
          fi
          {
            echo "tag_name=$REQUESTED_TAG"
            echo "commit_sha=$commit_sha"
            echo "short_sha=${commit_sha:0:7}"
            echo "is_stable=$is_stable"
          } >> "$GITHUB_OUTPUT"

  rust-cli-build:
    name: Build Rust CLI (${{ matrix.os }}-${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: amd64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          fi

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target

      - name: Build Rust CLI
        working-directory: server-rs
        shell: bash
        env:
          PATCHBAY_BUILD_VERSION: ${{ needs.verify.outputs.tag_name }}
          PATCHBAY_BUILD_COMMIT: ${{ needs.verify.outputs.commit_sha }}
        run: |
          PATCHBAY_BUILD_DATE="$(git show -s --format=%cI "$PATCHBAY_BUILD_COMMIT")"
          export PATCHBAY_BUILD_DATE
          cargo build --locked --release --target ${{ matrix.target }} -p patchbay-cli

      - name: Package Unix archives
        if: runner.os != 'Windows'
        working-directory: server-rs
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          package_dir="$RUNNER_TEMP/patchbay-cli"
          binary_dir="target/${{ matrix.target }}/release"
          mkdir -p "$package_dir"
          for prefix in "patchbay-cli-${version}-${{ matrix.os }}-${{ matrix.arch }}" "patchbay_${{ matrix.os }}_${{ matrix.arch }}"; do
            tar -czf "$package_dir/${prefix}.tar.gz" \
              -C "$binary_dir" patchbay \
              -C "$GITHUB_WORKSPACE" LICENSE README.md README.zh.md NOTICE
          done

      - name: Package Windows archives
        if: runner.os == 'Windows'
        working-directory: server-rs
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packageDir = Join-Path $env:RUNNER_TEMP "patchbay-cli"
          $binary = Join-Path (Get-Location) "target/${{ matrix.target }}/release/patchbay.exe"
          $metadata = @(
              (Join-Path $env:GITHUB_WORKSPACE "LICENSE"),
              (Join-Path $env:GITHUB_WORKSPACE "README.md"),
              (Join-Path $env:GITHUB_WORKSPACE "README.zh.md"),
              (Join-Path $env:GITHUB_WORKSPACE "NOTICE")
          )
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $files = @($binary) + $metadata
          foreach ($prefix in @(
              "patchbay-cli-$version-${{ matrix.os }}-${{ matrix.arch }}",
              "patchbay_${{ matrix.os }}_${{ matrix.arch }}"
          )) {
              Compress-Archive -Path $files -DestinationPath (Join-Path $packageDir "$prefix.zip") -Force
          }

      - name: Upload Rust CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: rust-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/patchbay-cli/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [macos-release-preflight, verify, rust-cli-build]
    # Only the canonical repository may publish release assets. A fork can
    # still run verification and builds without creating a Release.
    if: github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    steps:
      - name: Download Rust CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: rust-cli-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- ./* > checksums.txt

      - name: Create or reuse draft Rust CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
          IS_STABLE: ${{ needs.verify.outputs.is_stable }}
        run: |
          release_channel=(--latest=true)
          if [ "$IS_STABLE" != "true" ]; then
            release_channel=(--prerelease --latest=false)
          fi

          # The tag is the immutable release target. Resolve annotated tags
          # until the underlying commit and ensure it is still the commit that
          # triggered this workflow before reusing or creating any release.
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          while [ "$tag_type" = "tag" ]; do
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "${{ needs.verify.outputs.commit_sha }}" ]; then
            echo "::error::Tag $TAG_NAME no longer resolves to workflow commit ${{ needs.verify.outputs.commit_sha }}"
            exit 1
          fi

          # A failed upload must be recoverable with GitHub's "rerun failed
          # jobs" button. Reuse an existing release for this exact tag. The
          # automatic macOS workflow may have already published the matching
          # ARM64 release, in which case this manual workflow appends the
          # remaining assets after rechecking the immutable tag and channel.
          if release_json="$(gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
            expected_prerelease=false
            if [ "$IS_STABLE" != "true" ]; then
              expected_prerelease=true
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "::error::Release $TAG_NAME already exists with an incompatible channel"
              exit 1
            fi
            if [ "$is_draft" = "true" ]; then
              echo "Reusing the draft release for $TAG_NAME"
            else
              echo "Appending verified assets to the already-public release for $TAG_NAME"
            fi
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              --draft \
              "${release_channel[@]}"
          fi
          gh release upload "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # Multi-arch images are built natively per platform on dedicated runners
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and merged into a
  # manifest list. This avoids QEMU emulation, which was making the Next.js
  # arm64 build run for 30+ minutes. These self-hosted artifacts are manual
  # so desktop releases never wait for container publication.
  docker-backend-build:
    needs: [self-hosted-prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.self-hosted-prepare.outputs.tag_name }}

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-backend
          labels: |
            org.opencontainers.image.title=Patchbay Backend
            org.opencontainers.image.description=Patchbay self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.self-hosted-prepare.outputs.tag_name }}
            COMMIT=${{ needs.self-hosted-prepare.outputs.commit_sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [self-hosted-prepare, verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: self-hosted-docker-backend-${{ needs.self-hosted-prepare.outputs.tag_name }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.self-hosted-prepare.outputs.tag_name }}
            type=raw,value=sha-${{ needs.self-hosted-prepare.outputs.short_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "::error::No backend image digests were downloaded"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-backend@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: [self-hosted-prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.self-hosted-prepare.outputs.tag_name }}

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-web
          labels: |
            org.opencontainers.image.title=Patchbay Web
            org.opencontainers.image.description=Patchbay self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.self-hosted-prepare.outputs.tag_name }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/patchbay-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [self-hosted-prepare, verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: self-hosted-docker-web-${{ needs.self-hosted-prepare.outputs.tag_name }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchbay-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.self-hosted-prepare.outputs.tag_name }}
            type=raw,value=sha-${{ needs.self-hosted-prepare.outputs.short_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          shopt -s nullglob
          digest_files=(./*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "::error::No web image digests were downloaded"
            exit 1
          fi
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file#./}"
            digest_args+=("ghcr.io/${{ github.repository_owner }}/patchbay-web@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/patchbay-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [self-hosted-prepare, verify, docker-backend-merge, docker-web-merge]
    if: github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    concurrency:
      group: self-hosted-helm-chart-${{ needs.self-hosted-prepare.outputs.tag_name }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/patchbay
      OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.self-hosted-prepare.outputs.tag_name }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.self-hosted-prepare.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push ".chart-packages/patchbay-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/patchbay" --version "$CHART_VERSION"

  promote-self-hosted-latest:
    needs: [self-hosted-prepare, verify, docker-backend-merge, docker-web-merge]
    if: >-
      inputs.promote_latest &&
      needs.self-hosted-prepare.outputs.is_stable == 'true' &&
      github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote stable image tags
        env:
          TAG_NAME: ${{ needs.self-hosted-prepare.outputs.tag_name }}
        run: |
          for image in patchbay-backend patchbay-web; do
            docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:latest" \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${TAG_NAME}"
            docker buildx imagetools inspect \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:latest"
          done

  # Build the Desktop installers for every supported platform and upload them
  # to the draft GitHub Release created above. The release remains private
  # until every matrix entry succeeds. macOS production builds require a
  # Developer ID Application identity and successful Apple notarization.
  desktop:
    needs: [release, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
            msvc_arch: amd64
          - os: windows-latest
            target: win
            arch: arm64
            msvc_arch: amd64_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag_name }}
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install musl toolchain (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get install -y musl-tools

      - name: Setup MSVC linker (Windows)
        if: matrix.target == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Keep the linker and SDK library search paths aligned with the
          # Rust target built by this job. amd64_arm64 is the x64-hosted
          # ARM64 cross compiler required by aarch64-pc-windows-msvc.
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "${{ matrix.target }}" == "linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            rustup target add aarch64-unknown-linux-musl
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_AARCH64_UNKNOWN_LINUX_MUSL=musl-gcc" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == "linux" ]]; then
            rustup target add x86_64-unknown-linux-musl
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_X86_64_UNKNOWN_LINUX_MUSL=musl-gcc" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == "mac" && "${{ matrix.arch }}" == "arm64" ]]; then
            rustup target add aarch64-apple-darwin
          elif [[ "${{ matrix.target }}" == "mac" ]]; then
            rustup target add x86_64-apple-darwin
          elif [[ "${{ matrix.arch }}" == "arm64" ]]; then
            rustup target add aarch64-pc-windows-msvc
          else
            rustup target add x86_64-pc-windows-msvc
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        if: matrix.target != 'mac'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing on Linux/Windows for now — the public
          # release is unsigned for these platforms, the CLI carries the
          # trust boundary. Set CSC_LINK in repo secrets to enable
          # Windows signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --${{ matrix.arch }} --publish always

      - name: Package Desktop installers (macOS)
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package.mjs --mac --${{ matrix.arch }} --publish never

      - name: Verify Developer ID signature and notarization (macOS)
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'Patchbay.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::Packaged Patchbay.app was not found"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -Fq 'Authority=Developer ID Application:' <<<"$signature_details" || {
            echo "::error::Patchbay.app is not signed with a Developer ID Application identity"
            exit 1
          }
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<<"$signature_details" || {
            echo "::error::Patchbay.app was signed by an unexpected Apple team"
            exit 1
          }

          xcrun stapler validate "$app_path"
          assessment="$(spctl --assess --type execute --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$assessment"
          grep -Fq 'source=Notarized Developer ID' <<<"$assessment" || {
            echo "::error::Gatekeeper did not recognize Patchbay.app as notarized Developer ID software"
            exit 1
          }

      - name: Upload verified macOS release assets
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        shell: bash
        run: |
          version="${TAG_NAME#v}"
          metadata='latest-mac.yml'
          if [ "${{ matrix.arch }}" = 'x64' ]; then
            metadata='latest-x64-mac.yml'
          fi

          required_assets=(
            "dist/patchbay-desktop-$version-mac-${{ matrix.arch }}.dmg"
            "dist/patchbay-desktop-$version-mac-${{ matrix.arch }}.zip"
            "dist/$metadata"
          )
          for asset in "${required_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing verified macOS release asset $asset"
              exit 1
            fi
          done

          blockmap="dist/patchbay-desktop-$version-mac-${{ matrix.arch }}.zip.blockmap"
          if [ -f "$blockmap" ]; then
            required_assets+=("$blockmap")
          fi
          gh release upload "$TAG_NAME" \
            "${required_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-release:
    needs: [verify, release, desktop]
    if: github.repository == 'patchbay-ai/patchbay'
    runs-on: ubuntu-latest
    steps:
      - name: Download Rust CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: rust-cli-*
          path: release-assets
          merge-multiple: true

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          published_assets="$(gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"
          # electron-builder maps its `${arch}` macro per Linux package type:
          # x64 becomes x86_64 for AppImage/RPM and amd64 for deb, while arm64
          # becomes aarch64 for RPM. These are the actual uploaded filenames.
          for asset in \
            checksums.txt \
            "patchbay-cli-$version-linux-amd64.tar.gz" \
            "patchbay-cli-$version-linux-arm64.tar.gz" \
            "patchbay-cli-$version-darwin-amd64.tar.gz" \
            "patchbay-cli-$version-darwin-arm64.tar.gz" \
            "patchbay-cli-$version-windows-amd64.zip" \
            "patchbay-cli-$version-windows-arm64.zip" \
            "patchbay-desktop-$version-linux-x86_64.AppImage" \
            "patchbay-desktop-$version-linux-amd64.deb" \
            "patchbay-desktop-$version-linux-x86_64.rpm" \
            "patchbay-desktop-$version-linux-arm64.AppImage" \
            "patchbay-desktop-$version-linux-arm64.deb" \
            "patchbay-desktop-$version-linux-aarch64.rpm" \
            "latest-linux.yml" \
            "latest-linux-arm64.yml" \
            "patchbay-desktop-$version-mac-arm64.dmg" \
            "patchbay-desktop-$version-mac-arm64.zip" \
            "patchbay-desktop-$version-mac-x64.dmg" \
            "patchbay-desktop-$version-mac-x64.zip" \
            "latest-mac.yml" \
            "latest-x64-mac.yml" \
            "patchbay-desktop-$version-windows-x64.exe" \
            "patchbay-desktop-$version-windows-x64.exe.blockmap" \
            "patchbay-desktop-$version-windows-arm64.exe" \
            "patchbay-desktop-$version-windows-arm64.exe.blockmap" \
            "latest.yml" \
            "latest-arm64.yml"; do
            grep -Fxq "$asset" <<<"$published_assets" || {
              echo "::error::Draft release is missing required asset $asset"
              exit 1
            }
          done

      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
