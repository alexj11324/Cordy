name: Scoped review remediation runner

on:
  push:
    branches: [remediation/review-debt-20260824]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: review-remediation-135
  cancel-in-progress: true

jobs:
  remediate:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'remediation/review-debt-20260824') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'remediation/review-debt-20260824')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/review-debt-20260824
          fetch-depth: 0

      - name: Verify exact same-repository head
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          else
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune

      - name: Replay known reviewed fixes without forcing conflicts
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            6b52dddb5744e4649a1e665999543b3e4b018995
            92e5a112de11ab7fca40d28c00c76bda1dc62762
            b0641e6e789978c0e0dc89c8776dd055995b3835
            dd105d0b47d0b64d0a1c13ff70e71e8d60c49c00
