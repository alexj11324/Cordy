            ac907e01e41f8e5d261481997f2731927c410d1b
            29a908fff75261fda9cb9bfa3c2bad326a1b1742
            9c4ef21e1ee1fac0f1c1ab8df6ee36b5d8bb6250
            119bf7fe7953b192f8a7707ede9868d75a775ddc
            156c466c7e820a364a078eee21ba9dd9d773b73e
            c984d7486b9b0ca2797e170d48c8042776f1da49
            13facae967658456a4681c920b3265432f485fbf
            78aed98e1dafb1072b8a12e9a66fc93f6b242124
            bb6041e7271419a7fe5c52f1e8083dc043db0290
          )
          : > .remediation-replay-report.txt
          printf '# Review-fix replay report\n\n' >> .remediation-replay-report.txt
          for commit in "${commits[@]}"; do
            subject=$(git show -s --format=%s "$commit" 2>/dev/null || true)
            printf '## %s — %s\n' "$commit" "$subject" >> .remediation-replay-report.txt
            if git cherry-pick -x "$commit"; then
              printf 'applied\n\n' >> .remediation-replay-report.txt
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [[ -z "$conflicts" ]]; then
              git cherry-pick --skip || git cherry-pick --abort || true
              printf 'empty/already effective\n\n' >> .remediation-replay-report.txt
            else
              printf 'CONFLICT: %s\n\n' "$conflicts" >> .remediation-replay-report.txt
              git cherry-pick --abort
            fi
          done

      - name: Push replayed fixes before long validation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '[remediation-runner] replay reviewed fixes'
          fi
          git push origin HEAD:remediation/review-debt-20260824

      - name: Validate replayed tree
        shell: bash
        run: |
          set +e
          : > .remediation-test-report.txt
          run_check() {
            name="$1"; shift
            echo "## $name" >> .remediation-test-report.txt
            echo '\`\`\`' >> .remediation-test-report.txt
            "$@" >> .remediation-test-report.txt 2>&1
            code=$?
            echo '\`\`\`' >> .remediation-test-report.txt
            echo "exit=$code" >> .remediation-test-report.txt
            echo >> .remediation-test-report.txt
            return 0
          }
          run_check 'cargo fmt --all --check' bash -lc 'cd server-rs && cargo fmt --all -- --check'
          run_check 'cargo check workspace all targets' bash -lc 'cd server-rs && cargo check --workspace --all-targets --locked'
          run_check 'cargo test handler/service/server' bash -lc 'cd server-rs && cargo test -p cordy-handler -p cordy-service -p cordy-server --locked'
          run_check 'strict clippy core' bash -lc 'cd server-rs && cargo clippy -p cordy-handler -p cordy-service -p cordy-server -p cordy-cli --all-targets --locked -- -D warnings'

      - name: Publish validation report
        shell: bash
        run: |
          set -euo pipefail
          git add .remediation-test-report.txt
          if ! git diff --cached --quiet; then
            git commit -m '[remediation-runner] record validation results'
            git push origin HEAD:remediation/review-debt-20260824
          fi
