name: Exact-head review remediation patch runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: exact-review-remediation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: >-
      github.event.issue.number == 135 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/run-review-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cordy
          POSTGRES_USER: cordy
          POSTGRES_PASSWORD: cordy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cordy -d cordy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://cordy:cordy@localhost:5432/cordy?sslmode=disable
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve and verify PR head
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/135" --jq '.head.sha')"
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/135" --jq '.head.ref')"
          head_repo="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/135" --jq '.head.repo.full_name')"
          test "$head_ref" = 'remediation/review-debt-20260824'
          test "$head_repo" = "$GITHUB_REPOSITORY"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin remediation/review-debt-20260824
          test "$(git rev-parse HEAD)" = "${{ steps.pr.outputs.head_sha }}"
          test "$(git rev-parse origin/remediation/review-debt-20260824)" = "${{ steps.pr.outputs.head_sha }}"
          if git log -1 --pretty=%B | grep -q '^\[patch-runner\]'; then
            echo skip=true >> "$GITHUB_ENV"
          fi

      - name: Apply assertion-based remediation
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/remediation/apply.py
          python3 .github/remediation/apply.py
          rm .github/remediation/apply.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Format
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo fmt --all
          cd ..
          git diff --check

      - name: Migrate test database
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo run --locked -p cordy-migrate -- up

      - name: Check workspace
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo check --workspace --all-targets --locked

      - name: Test workspace
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo test --workspace --all-targets --locked

      - name: Strict clippy
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server-rs
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Push validated remediation
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m '[patch-runner] fix remaining validated review findings'
          git push origin HEAD:remediation/review-debt-20260824
