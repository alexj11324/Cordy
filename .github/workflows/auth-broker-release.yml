name: Auth Broker Release (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Versioned image tag to build; deploy only its resolved digest
        required: true
        type: string
      publish:
        description: Publish the image to GHCR (does not deploy or change traffic)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: auth-broker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/patchbay-auth-broker

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid OCI tag"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify auth broker contract and release boundary
        run: |
          node --test scripts/classify-auth-change.test.mjs
          pnpm --filter @patchbay/auth-broker typecheck
          pnpm --filter @patchbay/auth-broker test
          pnpm --filter @patchbay/auth-broker build

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Verify disabled-by-default deployment chart
        run: bash scripts/auth-broker-helm.test.sh

      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build independent auth broker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.auth-broker
          platforms: linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=auth-broker
          cache-to: type=gha,mode=max,scope=auth-broker

      - name: Summarize release boundary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "### Auth broker artifact"
            echo "- Image: \`$IMAGE:$IMAGE_TAG\`"
            echo "- Published: \`$PUBLISH\`"
            echo "- Deployment and production traffic changes: \`none\`"
          } >> "$GITHUB_STEP_SUMMARY"
