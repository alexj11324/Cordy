[workspace]
resolver = "2"
members = [
    "crates/patchbay-agent",
    "crates/patchbay-analytics",
    "crates/patchbay-auth",
    "crates/patchbay-channel",
    "crates/patchbay-daemon",
    "crates/patchbay-channel-engine",
    "crates/patchbay-cli",
    "crates/patchbay-composio",
    "crates/patchbay-config",
    "crates/patchbay-db",
    "crates/patchbay-dingtalk",
    "crates/patchbay-events",
    "crates/patchbay-handler",
    "crates/patchbay-ghsnapshot",
    "crates/patchbay-lark",
    "crates/patchbay-llm",
    "crates/patchbay-metrics",
    "crates/patchbay-protocol",
    "crates/patchbay-realtime",
    "crates/patchbay-redis",
    "crates/patchbay-scheduler",
    "crates/patchbay-service",
    "crates/patchbay-slack",
    "crates/patchbay-task-failure",
    "crates/patchbay-plugincontract",
    "crates/patchbay-remotemcp",
    "crates/patchbay-telegram",
    "crates/patchbay-util",
    "crates/patchbay-vcs",
    "crates/patchbay-wecom",
    "crates/patchbay-weixin",
    "crates/patchbay-migrate",
    "crates/patchbay-middleware",
    "crates/patchbay-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
# async runtime & web
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "multipart", "ws", "matched-path", "original-uri", "tower-log", "tracing"] }
tower-http = { version = "0.6", features = ["cors"] }
percent-encoding = "2.3"
# data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "ipnetwork",
] }
redis = { version = "0.27", features = ["tokio-rustls-comp", "connection-manager"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
prometheus = "0.14"
# errors
thiserror = "2"
anyhow = "1"
# ids & time
uuid = { version = "1", features = ["v7", "serde"] }
ipnetwork = "0.20"
chrono = { version = "0.4", features = ["serde"] }
# crypto & tokens
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
crc32fast = "1"
ring = "0.17"
jsonwebtoken = "9"
# async traits & lifecycle
async-trait = "0.1"
tokio-util = "0.7"
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = "1"
ulid = "1"
chrono-tz = "0.9"
regex = "1"
croner = "1"
serde_yaml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
# email & integrations
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
httpdate = "1"
structured-email-address = { version = "0.0.16", default-features = false }
# Patchbay's direct TLS clients use Ring. aws-config's rustls client also enables
# AWS-LC, so every production binary explicitly installs Ring before any
# ClientConfig::builder() call rather than relying on ambiguous auto-selection.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
base64 = "0.22"
include_dir = "0.7"
quoted_printable = "0.5"
hostname = "0.4"
# remotemcp secure HTTP stack (hyper legacy client with a custom pinned connector)
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "service", "tokio"] }
http-body-util = "0.1"
url = "2"
dirs = "6"
rustls-pemfile = "2"
# secretbox config-secret encryption (AES-256-GCM, nonce-prefixed layout)
aes-gcm = { version = "0.10", features = ["std", "getrandom"] }

# daemon manager (S9): filesystem walking, temp files, process control
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
walkdir = "2"
tempfile = "3"
libc = "0.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
