[package]
name = "cordy-daemon"
description = "Daemon manager (port of server/internal/daemon): agent lifecycle, health checks, artifact distribution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
cordy-db = { path = "../cordy-db" }
cordy-protocol = { path = "../cordy-protocol" }
cordy-realtime = { path = "../cordy-realtime" }
cordy-config = { path = "../cordy-config" }
# S9 lane D (plugin_hook_mcp / remote_mcp_broker): local MCP servers + upstream client
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
cordy-remotemcp = { path = "../cordy-remotemcp" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
