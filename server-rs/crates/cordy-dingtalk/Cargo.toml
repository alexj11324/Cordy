[package]
name = "cordy-dingtalk"
description = "DingTalk adapter: WS link, token/ack, markdown, media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = "1"
chrono = { workspace = true }
cordy-channel = { path = "../cordy-channel" }
cordy-channel-engine = { path = "../cordy-channel-engine" }
cordy-db = { path = "../cordy-db" }
cordy-events = { path = "../cordy-events" }
cordy-protocol = { path = "../cordy-protocol" }
cordy-util = { path = "../cordy-util" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Stream-mode WebSocket client. The rustls feature wires tungstenite's own
# tokio-rustls integration; the workspace pins rustls to the single ring
# provider and tokio-rustls runs with default-features = false, so no second
# crypto provider is pulled in (same wiring as cordy-wecom).
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "handshake",
    "__rustls-tls",
] }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
