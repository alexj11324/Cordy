[package]
name = "cordy-handler"
description = "HTTP handler + router layer — port of server/internal/handler and cmd/server/router.go (S8)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
chrono = { workspace = true }
cordy-auth = { path = "../cordy-auth" }
cordy-db = { path = "../cordy-db" }
cordy-middleware = { path = "../cordy-middleware" }
cordy-realtime = { path = "../cordy-realtime" }
cordy-util = { path = "../cordy-util" }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = { workspace = true }
