[package]
name = "patchbay-telegram"
description = "Telegram adapter: long-poll link, resolver set, markdown conversion, and outbound delivery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = "2"
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
patchbay-events = { path = "../patchbay-events" }
patchbay-protocol = { path = "../patchbay-protocol" }
patchbay-channel = { path = "../patchbay-channel" }
patchbay-channel-engine = { path = "../patchbay-channel-engine" }
patchbay-db = { path = "../patchbay-db" }
