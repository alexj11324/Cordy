[package]
name = "patchbay-daemon"
description = "Daemon manager: agent lifecycle, health checks, artifact distribution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
patchbay-db = { path = "../patchbay-db" }
patchbay-agent = { path = "../patchbay-agent" }
patchbay-protocol = { path = "../patchbay-protocol" }
patchbay-realtime = { path = "../patchbay-realtime" }
patchbay-config = { path = "../patchbay-config" }
patchbay-task-failure = { path = "../patchbay-task-failure" }
patchbay-util = { path = "../patchbay-util" }
# S9 lane D (plugin_hook_mcp / remote_mcp_broker): local MCP servers + upstream client
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["client-proxy"] }
patchbay-remotemcp = { path = "../patchbay-remotemcp" }

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
