[package]
name = "cordy-plugincontract"
description = "Versioned public contract between plugin authors and the Cordy host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
# raw_value: Hook.input_schema mirrors Go's json.RawMessage so an explicit
# JSON null stays distinguishable from an absent field (Go rejects null).
serde_json = { workspace = true, features = ["raw_value"] }
regex = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
