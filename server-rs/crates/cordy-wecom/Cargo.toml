[package]
name = "cordy-wecom"
description = "WeCom adapter: callback crypto, media streams, and resolvers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
sqlx = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
ipnetwork = { workspace = true }
redis = { workspace = true }
# AES-256-CBC media decryption (media_crypt.rs). The block cipher only; CBC
# chaining and the 32-byte PKCS#7 pad are implemented in-crate because WeCom's
# pad block is not the AES block size.
aes = "0.9"
# aibot long-connection WebSocket client. TLS is wired by this crate through
# tokio-rustls with the workspace's single ring provider; the __rustls-tls
# feature only enables tungstenite's Connector plumbing (its rustls dep shares
# our ring-provider rustls 0.23), so no second crypto provider enters the
# graph. connect_async_tls_with_config then accepts our explicit connector.
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
tungstenite = { version = "0.26", default-features = false }
futures-util = "0.3"
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
cordy-channel = { path = "../cordy-channel" }
cordy-channel-engine = { path = "../cordy-channel-engine" }
cordy-db = { path = "../cordy-db" }
cordy-events = { path = "../cordy-events" }
cordy-protocol = { path = "../cordy-protocol" }
cordy-realtime = { path = "../cordy-realtime" }
cordy-util = { path = "../cordy-util" }
