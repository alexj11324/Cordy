[package]
name = "patchbay-lark"
description = "Feishu/Lark adapter: WS long-conn, card builder, docx content, resolvers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
patchbay-channel = { path = "../patchbay-channel" }
patchbay-channel-engine = { path = "../patchbay-channel-engine" }
patchbay-db = { path = "../patchbay-db" }
patchbay-events = { path = "../patchbay-events" }
patchbay-protocol = { path = "../patchbay-protocol" }
patchbay-util = { path = "../patchbay-util" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
