[package]
name = "patchbay-server"
description = "Patchbay HTTP server (axum) — Rust replacement for cmd/server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "patchbay-server"
path = "src/main.rs"

[dependencies]
patchbay-config = { path = "../patchbay-config" }
patchbay-auth = { path = "../patchbay-auth" }
patchbay-analytics = { path = "../patchbay-analytics" }
patchbay-channel = { path = "../patchbay-channel" }
patchbay-channel-engine = { path = "../patchbay-channel-engine" }
patchbay-db = { path = "../patchbay-db" }
patchbay-daemon = { path = "../patchbay-daemon" }
patchbay-events = { path = "../patchbay-events" }
patchbay-dingtalk = { path = "../patchbay-dingtalk" }
patchbay-handler = { path = "../patchbay-handler" }
patchbay-lark = { path = "../patchbay-lark" }
patchbay-ghsnapshot = { path = "../patchbay-ghsnapshot" }
patchbay-metrics = { path = "../patchbay-metrics" }
patchbay-realtime = { path = "../patchbay-realtime" }
patchbay-scheduler = { path = "../patchbay-scheduler" }
patchbay-service = { path = "../patchbay-service" }
patchbay-slack = { path = "../patchbay-slack" }
patchbay-telegram = { path = "../patchbay-telegram" }
patchbay-util = { path = "../patchbay-util" }
patchbay-wecom = { path = "../patchbay-wecom" }
patchbay-weixin = { path = "../patchbay-weixin" }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server"] }
# Pin directly: the workspace table requests a `runtime` feature that this
# toolchain's hyper-util 0.1 line does not provide (same reason as patchbay-remotemcp).
hyper-util = { version = "0.1.20", default-features = false, features = [
    "http1",
    "tokio",
] }
redis = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["tracing"] }
tokio-util = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = "0.5"
uuid = { workspace = true }
serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
backtrace = { version = "0.3" }
flate2 = { workspace = true }
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"] }

[target.'cfg(target_os = "linux")'.dependencies]
jemalloc_pprof = "0.9"
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
